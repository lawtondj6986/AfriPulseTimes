      '<span class="v">'+count+'</span>'+
    '</div>';
  }

  html += '<div class="main">'+
    '<aside class="left-rail" aria-label="Archive by vertical">'+leftRailHTML+'</aside>'+
    '<section class="feed">'+
      '<div class="feed-head"><span>'+esc(t('latest_stories'))+'</span><a href="#/admin" style="color:var(--accent)">'+esc(t('manage'))+'</a></div>'+
      feedHTML+
    '</section>'+
    '<aside class="rpanel">'+
      '<div class="panel-head">'+esc(t('live_markets'))+'</div>'+marketsHTML+
      '<div class="panel-head">'+esc(t('commodities'))+'</div>'+commHTML+
      '<div style="margin:14px 0">'+renderAdSlotMini()+'</div>'+
      '<div class="panel-head">'+esc(t('browse_by_region'))+'</div>'+regionsHTML+
      '<div class="panel-head">'+esc(t('newsroom'))+'</div>'+
      '<div class="mrow" style="cursor:pointer" data-link="#/admin"><span class="n">'+esc(t('cms'))+'</span><span class="v">'+ARTICLES.length+' docs</span></div>'+
      '<div class="mrow" style="cursor:pointer" data-link="#/newsletter"><span class="n">'+esc(t('daily_briefing'))+'</span><span class="v">'+esc(t('preview'))+'</span></div>'+
    '</aside>'+
  '</div>';

  html += renderInvestorCTA() + renderFooter();
  return html;
}

  const stories=byRegion(slug);

  let cardsHTML='';
  for(const a of stories){
    cardsHTML += '<a class="vert-card" href="#/article/'+esc(a.slug)+'">'+
      '<div class="vc-thumb" data-emoji="'+esc(a.emoji||'📰')+'" style="background:'+esc(a.color||'#2a2a0a')+'">'+
        thumbImg(a)+
        '<span class="vc-cat">'+esc(vlabel(a.vertical))+'</span>'+
      '</div>'+
      '<div class="vc-body">'+
        '<div class="vc-title">'+esc(a.headline)+'</div>'+
        '<div class="vc-meta">'+esc(a.dateline)+' · '+esc(timeAgo(a.publishedAt))+' · '+esc(a.byline)+'</div>'+
      '</div>'+

  }
  if(!cardsHTML) cardsHTML='<div class="empty">No stories filed under this region yet.</div>';

  // Country chips
  let chipsHTML='';

  for(const c of realCountries.slice(0,10)){
    chipsHTML += '<span style="display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--bg-2);color:var(--ink);padding:4px 9px;font-weight:500;margin:2px 4px 2px 0">'+esc(c)+'</span>';

  return renderHeader(null)+renderTicker()+
    '<a class="art-back" href="#/" style="padding:14px 22px">'+esc(t('back_to_regions'))+'</a>'+
    '<section class="vert-head">'+
      '<div style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px">'+esc(t('browse_by_region'))+'</div>'+
      '<h2 class="vert-h">'+esc(rlabel(slug))+'</h2>'+
      '<div class="vert-sub">'+stories.length+' stor'+(stories.length===1?'y':'ies')+' · /region/'+esc(slug)+'</div>'+
      '<div style="margin-top:14px">'+chipsHTML+'</div>'+
    '</section>'+
    '<div class="vert-grid">'+cardsHTML+'</div>'+
    renderFooter();
}

// ── VIEW: SEARCH RESULTS ──────────────────────────────────────
function viewSearch(rawQuery){
  const q=(rawQuery||'').trim();
  const ql=q.toLowerCase();
  const hits = q ? published().filter(function(a){
    const hay=(a.headline+' '+(a.standfirst||'')+' '+(a.byline||'')+' '+(a.dateline||'')+' '+
               vlabel(a.vertical)+' '+(a.tags||[]).join(' ')).toLowerCase();
    return hay.indexOf(ql)>-1;
  }) : [];

  let cardsHTML='';
  for(const a of hits){
    cardsHTML += '<a class="vert-card" href="#/article/'+esc(a.slug)+'">'+
      '<div class="vc-thumb" data-emoji="'+esc(a.emoji||'📰')+'" style="background:'+esc(a.color||'#2a2a0a')+'">'+
        thumbImg(a)+
        '<span class="vc-cat">'+esc(vlabel(a.vertical))+'</span>'+
      '</div>'+
      '<div class="vc-body">'+
        '<div class="vc-title">'+esc(a.headline)+'</div>'+
        '<div class="vc-meta">'+esc(a.dateline)+' · '+esc(timeAgo(a.publishedAt))+' · '+esc(a.byline)+'</div>'+
      '</div>'+
    '</a>';
  }

  let sub, body;
  if(!q){
    sub=''; body='<div class="empty" style="padding:48px 22px">'+esc(t('search_empty'))+'</div>';
  }else if(hits.length){
    const noun = hits.length===1 ? t('search_count_one') : t('search_count_many');
    sub='<div class="vert-sub">'+hits.length+' '+esc(noun)+' “'+esc(q)+'”</div>';
    body='<div class="vert-grid">'+cardsHTML+'</div>';
  }else{
    sub='<div class="vert-sub">'+esc(t('search_none'))+' “'+esc(q)+'”</div>';
    body='<div class="empty" style="padding:40px 22px;max-width:560px">'+esc(t('search_none_hint'))+'</div>';
  }

  return renderHeader(null)+renderTicker()+
    '<section class="vert-head">'+
      '<div style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px">'+esc(t('search_eyebrow'))+'</div>'+
      '<h2 class="vert-h">'+(q?('“'+esc(q)+'”'):esc(t('search_placeholder')))+'</h2>'+
      sub+
    '</section>'+
    body+
    renderFooter();
}

function viewArticle(slug){
  const a=localizeArticle(getArticle(slug));   // reader page → translated when available
  if(!a) return view404();
  const related=byVertical(a.vertical).filter(r=>r.slug!==a.slug).slice(0,4);
  let relHTML='';
  for(const r of related){
    relHTML += '<a class="rel" href="#/article/'+esc(r.slug)+'">'+
      '<div class="rel-cat">'+esc(vlabel(r.vertical))+' · '+esc(r.dateline)+'</div>'+
      '<div class="rel-t">'+esc(r.headline)+'</div>'+
      '<div class="rel-url">/article/'+esc(r.slug)+'</div>'+
    '</a>';
  }
  if(!relHTML) relHTML='<div style="color:var(--muted);font-size:13px;font-style:italic">·</div>';

  let bodyHTML='';
  for(const p of (a.body||[])) bodyHTML += '<p>'+esc(p)+'</p>';

  let tagsHTML='';
  if(a.tags && a.tags.length){
    tagsHTML='<div class="art-tags">';
    for(const tg of a.tags) tagsHTML+='<span class="art-tag">'+esc(tg)+'</span>';
    tagsHTML+='</div>';
  }

  const sourceBlock = (a.source==='rss' && a.sourceUrl)
    ? '<div class="art-source"><strong style="color:#E5484D">Live wire from '+esc(a.sourceLabel||a.byline)+'.</strong> <a href="'+esc(a.sourceUrl)+'" target="_blank" rel="noopener">Read at source ↗</a></div>'
    : '';

  const langNote = CURRENT_LANG !== 'en'
    ? '<div class="art-lang-note" dir="'+(CURRENT_LANG==='ar'?'rtl':'ltr')+'">'+esc(t('not_localized'))+'</div>'
    : '';

  return renderHeader(a.vertical)+renderTicker()+
    '<a class="art-back" href="#/v/'+esc(a.vertical)+'">'+esc(t('back_all'))+' '+esc(vlabel(a.vertical))+'</a>'+
    renderArticleMedia(a)+
    '<article class="article">'+
      '<div class="art-body" dir="ltr">'+
        '<div class="art-kicker">'+esc(a.kicker)+'</div>'+
        '<h2 class="art-h1">'+esc(a.headline)+'</h2>'+
        '<div class="art-meta">'+
          (function(){
            const jr=findJournalistByName(a.byline);
            const bylineEl = jr ? '<a href="#/journalist/'+esc(jr.slug)+'" style="color:var(--ink);font-weight:500;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px">'+esc(a.byline)+'</a>' : esc(a.byline);
            return '<span class="by">By '+bylineEl+'</span>';
          })()+' · '+esc(a.dateline)+' · '+esc(timeAgo(a.publishedAt))+' · '+esc(a.readingMin||4)+' min read'+
        '</div>'+
        shareRow(a)+
        '<p class="art-lead">'+esc(a.standfirst)+'</p>'+
        bodyHTML+
        sourceBlock+
        tagsHTML+
        langNote+
        '<div class="art-note">'+esc(t('edit_in_cms')).replace('CMS','<a href="#/admin/edit/'+esc(a.slug)+'" style="color:var(--accent);text-decoration:underline">CMS</a>')+'</div>'+
      '</div>'+
      '<aside class="art-side">'+
        '<div class="panel-head" style="margin-top:0;border-top:none">'+esc(t('live'))+' · '+esc(a.dateline)+'</div>'+
        '<div class="data-row"><div class="data-label">Cobalt /t</div><div class="data-val">$32,450</div><div class="data-chg dn">▼ 0.8%</div></div>'+
        '<div class="data-row"><div class="data-label">Brent</div><div class="data-val">$81.30</div><div class="data-chg dn">▼ 0.9%</div></div>'+
        '<div class="data-row"><div class="data-label">USD / NGN</div><div class="data-val">1,540</div><div class="data-chg dn">▼ 0.2%</div></div>'+
        '<div class="data-row"><div class="data-label">JSE</div><div class="data-val">82,440</div><div class="data-chg up">▲ 1.2%</div></div>'+
      '</aside>'+
    '</article>'+
    '<section class="related">'+
      '<div class="panel-head" style="margin-top:0;border-top:none">'+esc(t('more_from'))+' '+esc(vlabel(a.vertical))+'</div>'+
      '<div class="rel-grid">'+relHTML+'</div>'+
    '</section>'+
    renderFooter();
}

function adminShell(activeSlug, paneHTML, section){
  section=section||'articles';
  const newLeads=(LEADS||[]).filter(l=>l.status==='new').length;
  const leadsBadge='<span class="adm-nav-badge" id="adm-leads-badge"'+(newLeads?'':' style="display:none"')+'>'+(newLeads||'')+'</span>';
  const navHTML='<div class="adm-nav">'+
    '<a class="adm-nav-tab'+(section==='articles'?' active':'')+'" href="#/admin">Articles</a>'+
    '<a class="adm-nav-tab'+(section==='leads'?' active':'')+'" href="#/admin/leads">Enquiries'+leadsBadge+'</a>'+
  '</div>';
  const all=ARTICLES.slice().sort((a,b)=>new Date(b.publishedAt)-new Date(a.publishedAt));
  let docList='';
  for(const a of all){
    const isLive=a.source==='rss';
    const cls=isLive?'live':(a.status==='published'?'pub':'draft');
    const lbl=isLive?'live wire':a.status;
    docList += '<div class="adm-doc'+(a.slug===activeSlug?' active':'')+'" data-link="#/admin/edit/'+esc(a.slug)+'">'+
      '<div class="adm-doc-title">'+esc(a.headline)+'</div>'+
      '<div class="adm-doc-meta">'+
        '<span class="adm-status s-'+cls+'">'+esc(lbl)+'</span>'+
        '<span>'+esc(vshort(a.vertical))+' · '+esc(timeAgo(a.publishedAt))+'</span>'+
      '</div>'+
    '</div>';
  }

  return ''+
  '<div class="topbar"><div class="topbar-date">AfriPulse Admin · Sanity-style CMS</div><div class="topbar-right"><a href="#/">'+esc(t('back_to_site'))+'</a><a class="btn-sub" href="#/admin/new">'+esc(t('new_article'))+'</a></div></div>'+
  '<div class="admin">'+
    '<aside class="adm-list">'+
      '<div class="adm-acct">'+
        '<span class="adm-acct-email" title="'+esc(currentUserEmail())+'">'+esc(currentUserEmail()||'Signed in')+'</span>'+
        '<button class="adm-btn" id="signout-btn" type="button">Sign out</button>'+
      '</div>'+
      navHTML+
      '<div class="adm-list-head">'+
        '<div class="adm-list-title">Articles · '+ARTICLES.length+'</div>'+
        '<button class="adm-new-btn" type="button" data-link="#/admin/new" title="New article">+</button>'+
      '</div>'+
      '<div class="adm-filter"><input id="adm-filter" type="search" placeholder="Filter articles…"></div>'+
      '<div id="adm-doc-list">'+docList+'</div>'+
    '</aside>'+
    '<main class="adm-pane">'+paneHTML+'</main>'+
  '</div>';
}

const LEAD_INTEREST_LABEL={investor:'Investor',advertiser:'Advertiser',partner:'Partner',other:'Other'};
function leadDateFull(iso){
  try{ return new Date(iso).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return iso||''; }
}
function leadRow(l){
  const interest=l.interest||'other';

// ── ROUTER ────────────────────────────────────────────────────
function route(){
  try{
    const hash=(location.hash||'#/').replace(/^#/,'');
    const parts=hash.split('/').filter(Boolean);
    const app=document.getElementById('app');
    if(!app){ console.error('No #app element'); return; }

    // Supabase magic-link callback lands here with tokens in the URL; hold a
    // "signing in…" screen until onAuthStateChange restores the intended route.
    const isAuthCallback=hash.indexOf('access_token')>-1 || hash.indexOf('error_description')>-1 || (location.search||'').indexOf('code=')>-1;

    let html;
    if(isAuthCallback) html=viewAuthChecking();
    else if(parts.length===0) html=viewHome();
    else if(parts[0]==='article' && parts[1]) html=viewArticle(decodeURIComponent(parts[1]));
    else if(parts[0]==='v' && parts[1]) html=viewVertical(decodeURIComponent(parts[1]));
    else if(parts[0]==='region' && parts[1]) html=viewRegion(decodeURIComponent(parts[1]));
    else if(parts[0]==='search') html=viewSearch(decodeURIComponent(parts.slice(1).join('/')));
    else if(parts[0]==='journalists') html=viewJournalists();
    else if(parts[0]==='journalist' && parts[1]) html=viewJournalist(decodeURIComponent(parts[1]));
    else if(parts[0]==='admin'){
      // Gate every #/admin* route on an authenticated session.
      if(!AUTH_READY) html=viewAuthChecking();
      else if(!isAuthed()) html=viewAdminLogin('#'+hash);
      else if(parts[1]==='new') html=viewNewArticle();
      else if(parts[1]==='leads') html=viewAdminLeads();
      else if(parts[1]==='edit' && parts[2]) html=viewAdmin(decodeURIComponent(parts[2]));
      else html=viewAdmin(null);
    }
    else if(parts[0]==='newsletter') html=viewNewsletter();
    else if(parts[0]==='privacy') html=viewLegal('privacy');
    else if(parts[0]==='terms') html=viewLegal('terms');
    else html=view404();

    app.innerHTML=html;
    try{ window.scrollTo(0,0); }catch(e){}
    updateDevbarPath();
    bindView();
  }catch(err){
    console.error('Route error:',err);
    const app=document.getElementById('app');
    if(app) app.innerHTML='<div style="padding:60px 22px;text-align:center"><h2 style="font-family:\'Fraunces\',serif;color:var(--accent);font-size:32px;margin-bottom:10px">Something broke.</h2><p style="color:var(--muted);font-size:14px">Check the browser console, then click <a href="#/" style="color:var(--accent)">Home</a> to retry.</p><p style="font-size:11px;color:var(--muted);margin-top:18px;font-family:monospace">'+esc(String(err.message||err))+'</p></div>';
  }
}

function updateDevbarPath(){
  const info=document.getElementById('dev-info');
  if(info){
    const wires=ARTICLES.filter(a=>a.source==='rss').length;
    info.textContent = (wires>0 ? wires+' wires · ' : '')+'lang: '+CURRENT_LANG;
  }
  document.querySelectorAll('.devbar a[data-r]').forEach(a=>a.classList.remove('active'));
  const h=location.hash||'#/';
  let activeKey='home';
  if(h.startsWith('#/article/')||h==='#/'||h==='#'||h==='') activeKey='home';
  else if(h.startsWith('#/v/')) activeKey='vert';
  else if(h.startsWith('#/region/')) activeKey='home';
  else if(h.startsWith('#/journalists')||h.startsWith('#/journalist/')) activeKey='home';
  else if(h.startsWith('#/admin')) activeKey='admin';
  else if(h.startsWith('#/newsletter')) activeKey='nl';
  const el=document.querySelector('.devbar a[data-r="'+activeKey+'"]');
  if(el) el.classList.add('active');
}

// ── EVENT BINDING (delegated) ─────────────────────────────────
function bindView(){
  // Copy-link share button (article pages)
  document.querySelectorAll('[data-share-url]').forEach(function(btn){
    btn.addEventListener('click',function(){
      const url=btn.getAttribute('data-share-url');
      const done=function(){ toast(CURRENT_LANG==='fr'?'Lien copié':CURRENT_LANG==='ar'?'تم نسخ الرابط':'Link copied'); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(done).catch(function(){ window.prompt('Copy this link:', url); });
      }else{ window.prompt('Copy this link:', url); }
    });
  });

  // data-link → set hash
  document.querySelectorAll('[data-link]').forEach(el=>{
    el.addEventListener('click',function(e){
      e.preventDefault();
      const href=el.getAttribute('data-link');
      if(href) location.hash=href;
    });
  });

  // Logo home
  document.querySelectorAll('[data-r="home"]').forEach(el=>{
    if(el.classList && el.classList.contains('logo')){
      el.addEventListener('click',function(){ location.hash='#/'; });
    }
  });

  // Language switcher — works on every view
  document.querySelectorAll('.lang-link[data-lang]').forEach(el=>{
    el.addEventListener('click',function(e){
      e.preventDefault();
      setLang(el.getAttribute('data-lang'));
    });
  });

  // Left rail · per-vertical collapse (click the arrow area; the full anchor still navigates)
  // We let users tap the small arrow chevron to expand/collapse without navigating away.
  document.querySelectorAll('.lr-vert-head .arrow').forEach(arrow=>{
    arrow.addEventListener('click',function(e){
      e.preventDefault();
      e.stopPropagation();
      const head=arrow.closest('.lr-vert-head');
      const vk=head && head.getAttribute('data-lr-vert');
      if(!vk) return;
      const list=document.querySelector('[data-lr-list="'+vk+'"]');
      if(list){
        list.classList.toggle('open');
        arrow.classList.toggle('open');
      }
    });
  });

  // Left rail · expand/collapse all
  const toggleAll=document.getElementById('lr-toggle-all');
  if(toggleAll){
    toggleAll.addEventListener('click',function(){
      const isExpanded=toggleAll.getAttribute('data-state')==='expanded';
      document.querySelectorAll('.lr-list').forEach(l=>l.classList.toggle('open',!isExpanded));
      document.querySelectorAll('.lr-vert-head .arrow').forEach(a=>a.classList.toggle('open',!isExpanded));
      toggleAll.setAttribute('data-state',isExpanded?'collapsed':'expanded');
      // Update label dynamically based on current language
      const collapseLbl = CURRENT_LANG==='fr'?'Tout replier':CURRENT_LANG==='ar'?'طيّ الكل':'Collapse all';
      const expandLbl = CURRENT_LANG==='fr'?'Tout déplier':CURRENT_LANG==='ar'?'فتح الكل':'Expand all';
      toggleAll.textContent = isExpanded ? expandLbl : collapseLbl;
    });
  }

  // Subscribe → /api/subscribe (Supabase + Buttondown)
  const sub=document.getElementById('subscribe-link');
  if(sub) sub.addEventListener('click',function(e){
    e.preventDefault();
    openSubscribeModal();
  });

  // Investor / partner enquiry → /api/contact (Supabase leads table)
  const investForm=document.getElementById('invest-form');
  if(investForm){
    investForm.addEventListener('submit',function(e){
      e.preventDefault();
      const nameEl=document.getElementById('if-name');
      const emailEl=document.getElementById('if-email');
      const orgEl=document.getElementById('if-org');
      const interestEl=document.getElementById('if-interest');
      const msgEl=document.getElementById('if-msg');
      const btn=document.getElementById('if-submit');
      const status=document.getElementById('if-status');
      const name=(nameEl.value||'').trim();
      const email=(emailEl.value||'').trim();
      const okEmail=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      function setStatus(kind,text){
        status.className='if-status show '+kind;
        status.textContent=text;
      }
      if(!name || !okEmail){ setStatus('err',t('invest_form_need')); (name?emailEl:nameEl).focus(); return; }
      btn.disabled=true;
      const original=btn.textContent;
      btn.textContent=t('invest_form_sending');
      setStatus('', '');
      const payload={
        name:name, email:email,
        organisation:(orgEl.value||'').trim(),
        interest:interestEl.value,
        message:(msgEl.value||'').trim(),
        language:CURRENT_LANG
      };
      fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
        .then(function(r){ if(!r.ok) throw new Error('bad status '+r.status); return r.json().catch(function(){return {};}); })
        .then(function(){
          setStatus('ok',t('invest_form_success'));
          investForm.reset();
        })
        .catch(function(err){
          console.warn('contact submit failed',err);
          setStatus('err',t('invest_form_error'));
        })
        .then(function(){ btn.disabled=false; btn.textContent=original; });
    });
  }

  // Search → dedicated results view (#/search/<query>)
  const search=document.getElementById('site-search');
  if(search){
    // Pre-fill the box when the current view IS a search, so the query stays visible.
    const curHash=(location.hash||'').replace(/^#/,'');
    if(curHash.indexOf('/search/')===0){
      try{ search.value=decodeURIComponent(curHash.slice('/search/'.length)); }catch(e){}
    }
    search.addEventListener('keydown',function(e){
      if(e.key!=='Enter') return;
      e.preventDefault();
      const q=this.value.trim();
      if(!q) return;
      location.hash='#/search/'+encodeURIComponent(q);
    });
  }

  // Admin filter
  const filt=document.getElementById('adm-filter');
  if(filt){
    filt.addEventListener('input',function(){
      const q=this.value.trim().toLowerCase();
      document.querySelectorAll('#adm-doc-list .adm-doc').forEach(d=>{
        const t=d.querySelector('.adm-doc-title').textContent.toLowerCase();
        d.style.display=(!q || t.indexOf(q)>-1)?'':'none';
      });
    });
  }

  // Admin editor
  const headInput=document.querySelector('input[name="headline"]');
  if(headInput){
    headInput.addEventListener('input',function(){
      const c=document.getElementById('head-count');
      if(c) c.textContent=this.value.length;
      const form=document.getElementById('article-form');
      const origSlug=form && form.getAttribute('data-original-slug');
      if(!origSlug){
        const sp=document.getElementById('slug-preview');
        if(sp) sp.textContent='/article/'+(slugify(this.value)||'untitled');
      }
    });
  }

  const tagInput=document.getElementById('tag-input');
  if(tagInput){
    tagInput.addEventListener('keydown',function(e){
      if(e.key!=='Enter' && e.key!==',') return;
      e.preventDefault();
      const val=this.value.trim();
      if(!val) return;
      const container=document.getElementById('tags-container');
      const existing=Array.from(container.querySelectorAll('.adm-tag')).map(tt=>tt.getAttribute('data-tag'));
      if(existing.indexOf(val)===-1){
        const span=document.createElement('span');
        span.className='adm-tag';
        span.setAttribute('data-tag',val);
        span.style.cssText='background:#222528;color:#9AA0A6;padding:4px 10px;border-radius:999px;font-size:11px;display:inline-flex;align-items:center;gap:6px;margin:2px';
        span.innerHTML=esc(val)+'<span class="x" data-remove-tag="'+esc(val)+'" style="cursor:pointer;color:#5F6469">×</span>';
        container.insertBefore(span,this);
      }
      this.value='';
    });
    const tagsContainer=document.getElementById('tags-container');
    if(tagsContainer){
      tagsContainer.addEventListener('click',function(e){
        const x=e.target.closest('[data-remove-tag]');
        if(x && x.parentElement) x.parentElement.remove();
      });
    }
  }

  // Article image upload → Supabase Storage
  const upBtn=document.getElementById('media-upload-btn');
  const fileInput=document.getElementById('media-file');
  if(upBtn && fileInput){
    upBtn.addEventListener('click',function(){ fileInput.click(); });
    fileInput.addEventListener('change',function(){
      const f=this.files && this.files[0];
      this.value='';                       // allow re-picking the same file later
      if(!f) return;
      const statusEl=document.getElementById('media-upload-status');
      if(!/^image\//.test(f.type)){ if(statusEl){statusEl.textContent='Please choose an image file.';statusEl.className='adm-upload-status err';} return; }
      if(f.size > 5*1024*1024){ if(statusEl){statusEl.textContent='Image is over 5 MB — please compress it.';statusEl.className='adm-upload-status err';} return; }
      upBtn.disabled=true;
      if(statusEl){ statusEl.textContent='Uploading…'; statusEl.className='adm-upload-status'; }
      uploadArticleImage(f).then(function(res){
        upBtn.disabled=false;
        if(res.error){
          if(statusEl){ statusEl.textContent='Upload failed: '+res.error; statusEl.className='adm-upload-status err'; }
          return;
        }
        const srcInput=document.getElementById('media-src');
        if(srcInput) srcInput.value=res.url;
        const typeSel=document.querySelector('select[name="mediaType"]');
        if(typeSel && !typeSel.value) typeSel.value='image';
        const prev=document.getElementById('media-preview');
        if(prev){ prev.innerHTML='<img src="'+esc(res.url)+'" alt="Uploaded hero image">'; prev.style.display=''; }
        if(statusEl){ statusEl.textContent='Uploaded ✓'; statusEl.className='adm-upload-status ok'; }
      });
    });
  }

  const saveBtn=document.getElementById('save-btn');
  if(saveBtn) saveBtn.addEventListener('click',saveArticle);
  const delBtn=document.getElementById('delete-btn');
  if(delBtn) delBtn.addEventListener('click',deleteArticle);

  // Auth: sign out + magic-link login form
  const signoutBtn=document.getElementById('signout-btn');
  if(signoutBtn) signoutBtn.addEventListener('click',signOut);
  const loginForm=document.getElementById('login-form');
  if(loginForm){
    loginForm.addEventListener('submit',function(e){
      e.preventDefault();
      const emailEl=document.getElementById('login-email');
      const email=emailEl?emailEl.value.trim():'';
      if(!email){ toast('Enter your email.'); return; }
      const returnHash=loginForm.getAttribute('data-return')||'#/admin';
      const btn=document.getElementById('login-send');
      if(btn){ btn.disabled=true; btn.textContent='Sending…'; }
      sendMagicLink(email,returnHash).then(function(ok){
        if(ok){ LOGIN_SENT_EMAIL=email; route(); }
        else if(btn){ btn.disabled=false; btn.textContent='Send magic link'; }
      });
    });
  }
  const loginReset=document.getElementById('login-reset');
  if(loginReset) loginReset.addEventListener('click',function(){ LOGIN_SENT_EMAIL=''; route(); });

  // Admin leads (investor / partner enquiries)
  const leadsRefresh=document.getElementById('leads-refresh');
  if(leadsRefresh) leadsRefresh.addEventListener('click',function(){ toast('Refreshing enquiries…'); refreshLeads(); });
  const leadsFilter=document.getElementById('leads-filter');
  if(leadsFilter){
    leadsFilter.addEventListener('input',function(){
      const q=this.value.trim().toLowerCase();
      document.querySelectorAll('#adm-leads-list .lead-card').forEach(function(c){
        const hay=(c.getAttribute('data-hay')||'').toLowerCase();
        c.style.display=(!q || hay.indexOf(q)>-1)?'':'none';
      });
    });
  }
  const leadsList=document.getElementById('adm-leads-list');
  if(leadsList){
    leadsList.addEventListener('change',function(e){
      const sel=e.target.closest('[data-lead-status]');
      if(!sel) return;
      const id=sel.getAttribute('data-lead-status');
      const status=sel.value;
      sel.className='lead-status s-'+status;
      setLeadStatus(id,status).then(function(ok){
        toast(ok?('Marked "'+status+'".'):'Could not update — check your connection.');
        refreshLeadsSummary();
      });
    });
    leadsList.addEventListener('click',function(e){
      const del=e.target.closest('[data-lead-del]');
      if(!del) return;
      const id=del.getAttribute('data-lead-del');
      if(!confirm('Delete this enquiry? This cannot be undone.')) return;
      deleteLead(id).then(function(ok){
        if(ok){ toast('Enquiry deleted.'); route(); }
        else toast('Could not delete — check your connection.');
      });
    });
  }
}

function saveArticle(){
  const form=document.getElementById('article-form');
  if(!form){ toast('Editor not found.'); return; }
  const data={};
  form.querySelectorAll('[name]').forEach(el=>{ data[el.name]=el.value.trim(); });
  if(!data.headline){ toast('Headline required.'); return; }

  const originalSlug=form.getAttribute('data-original-slug') || '';
  const existing=originalSlug?getArticle(originalSlug):null;
  const tags=Array.from(form.querySelectorAll('#tags-container .adm-tag')).map(tt=>tt.getAttribute('data-tag'));
  const body=(data.body||'').split(/\n{2,}/).map(p=>p.trim()).filter(Boolean);

  let newSlug;
  if(existing){
    newSlug=existing.slug;
  }else{
    newSlug=slugify(data.headline);
    let n=1; const base=newSlug;
    while(ARTICLES.some(a=>a.slug===newSlug)){ newSlug=base+'-'+(++n); }
  }

  // Media: only set if a type was chosen
  let mediaObj = null;
  if(data.mediaType){
    mediaObj = {
      type: data.mediaType,
      src: data.mediaSrc || '',
      caption: data.mediaCaption || '',
      credit: data.mediaCredit || ''
    };
  }

  const updated={
    slug:newSlug,
    vertical:data.vertical||'front',
    kicker:data.kicker||'',
    headline:data.headline,
    standfirst:data.standfirst||'',
    byline:data.byline||'AfriPulse Bureau',
    dateline:data.dateline||'Lagos',
    readingMin:parseInt(data.readingMin,10)||4,
    emoji:data.emoji||'📰',
    color:data.color||'#2a2a0a',
    status:data.status||'draft',
    publishedAt:existing?existing.publishedAt:new Date().toISOString(),
    tags:tags,
    body:body.length?body:(existing?existing.body:['Start writing here.']),
    media: mediaObj,
    source:'authored'
  };

  if(existing){
    const i=ARTICLES.findIndex(a=>a.slug===originalSlug);
    ARTICLES[i]=updated;
  }else{
    ARTICLES.unshift(updated);
  }
  saveCache(ARTICLES);                 // instant local persistence
  toast(existing?'Saved.':'Created.');
  location.hash='#/admin/edit/'+updated.slug;
  setTimeout(route,30);
  // Persist this article (save / publish) to Supabase.
  dbUpsert(updated).then(function(ok){ if(!ok) toast('Saved locally · sign in to sync to the database.'); });
}

function deleteArticle(){
  const form=document.getElementById('article-form');
  if(!form) return;
  const slug=form.getAttribute('data-original-slug');
  if(!slug) return;
  if(!confirm('Delete this article?')) return;
  ARTICLES=ARTICLES.filter(a=>a.slug!==slug);
  saveCache(ARTICLES);                 // instant local removal
  toast('Deleted.');
  location.hash='#/admin';
  setTimeout(route,30);
  // Remove from Supabase.
  dbDelete(slug).then(function(ok){ if(!ok) toast('Removed locally · sign in to sync the deletion.'); });
}

// ── NEWSLETTER SIGNUP ─────────────────────────────────────────
// Collects an email (without altering the page design) and POSTs it to
// /api/subscribe, which records it in Supabase and registers it with Buttondown.
function subToast(kind){
  const L=CURRENT_LANG;
  const M={
    invalid:{en:'Enter a valid email address.',fr:'Saisissez une adresse e-mail valide.',ar:'أدخل بريدًا إلكترونيًا صالحًا.'},
    sending:{en:'Subscribing…',fr:'Inscription…',ar:'جارٍ الاشتراك…'},
    ok:{en:'Subscribed to the Daily Briefing.',fr:'Inscrit à la newsletter quotidienne.',ar:'تم الاشتراك في النشرة اليومية.'},
    err:{en:'Could not subscribe · try again.',fr:'Échec de l\'inscription · réessayez.',ar:'تعذّر الاشتراك · حاول مجددًا.'}
  };
  return (M[kind]&&(M[kind][L]||M[kind].en))||'';
}
// A clean inline subscribe modal (replaces the old window.prompt). Posts to
// /api/subscribe → Supabase + Buttondown.
function openSubscribeModal(){
  if(document.getElementById('nl-modal')) return;
  const L=CURRENT_LANG;
  const heads={en:'Get the Daily Briefing',fr:'Recevez le brief quotidien',ar:'احصل على النشرة اليومية'};
  const subs={en:'The continent, every morning — the stories that matter across 54 nations, in your inbox.',fr:'Le continent chaque matin — l\'essentiel à travers 54 nations, dans votre boîte mail.',ar:'القارة كل صباح — أهم الأخبار عبر 54 دولة، في بريدك.'};
  const wrap=document.createElement('div');
  wrap.id='nl-modal'; wrap.className='nl-modal';
  wrap.setAttribute('dir', L==='ar'?'rtl':'ltr');
  wrap.innerHTML=
    '<div class="nl-modal-card" role="dialog" aria-modal="true" aria-label="Subscribe">'+
      '<button class="nl-modal-x" type="button" aria-label="Close">×</button>'+
      '<div class="nl-modal-kicker">'+esc(t('daily_briefing'))+'</div>'+
      '<h3 class="nl-modal-h">'+esc(heads[L]||heads.en)+'</h3>'+
      '<p class="nl-modal-p">'+esc(subs[L]||subs.en)+'</p>'+
      '<form class="nl-modal-form" novalidate>'+
        '<input class="nl-modal-email" type="email" required autocomplete="email" placeholder="you@example.com">'+
        '<button class="nl-modal-btn" type="submit">'+esc(t('subscribe'))+'</button>'+
      '</form>'+
      '<div class="nl-modal-note">🔒 EN · FR · AR · one email each morning. No spam, unsubscribe anytime.</div>'+
    '</div>';
  document.body.appendChild(wrap);
  const close=function(){ wrap.remove(); document.removeEventListener('keydown',onKey); };
  const onKey=function(e){ if(e.key==='Escape') close(); };
  document.addEventListener('keydown',onKey);
  wrap.addEventListener('click',function(e){ if(e.target===wrap) close(); });
  wrap.querySelector('.nl-modal-x').addEventListener('click',close);
  const form=wrap.querySelector('.nl-modal-form');
  const emailEl=wrap.querySelector('.nl-modal-email');
  const btn=wrap.querySelector('.nl-modal-btn');
  form.addEventListener('submit',function(e){
    e.preventDefault();
    const email=(emailEl.value||'').trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast(subToast('invalid')); emailEl.focus(); return; }
    btn.disabled=true; btn.textContent=subToast('sending');
    fetch('/api/subscribe',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ email:email, language:CURRENT_LANG }) })
      .then(function(r){ return r.json().catch(function(){ return null; }); })
      .then(function(d){ if(d && d.ok){ toast(subToast('ok')); close(); } else { toast(subToast('err')); btn.disabled=false; btn.textContent=t('subscribe'); } })
      .catch(function(){ toast(subToast('err')); btn.disabled=false; btn.textContent=t('subscribe'); });
  });
  setTimeout(function(){ emailEl.focus(); },40);
}

// ── LIVE WIRE ─────────────────────────────────────────────────
// RSS aggregation now runs server-side in /api/pull-wire (Vercel cron, every
// 15 min). The browser no longer fetches feeds through CORS proxies: signed-in
// admins can trigger a server pull, and everyone refreshes wires from the
// database. Feed list + parsing live in the serverless function / rss_sources.
const AUTO_REFRESH_MS=5*60*1000;   // how often the client re-reads the DB
let AUTO_TIMER=null;
// Vertical default emoji/colour, also used by the store's rowToArticle fallback.
const VDEF={front:{emoji:'🌍',color:'#0e2818'},politics:{emoji:'🏛️',color:'#1a3a1a'},mining:{emoji:'⛏️',color:'#3a1a0a'},markets:{emoji:'📊',color:'#0a1a2a'},tech:{emoji:'🤖',color:'#2a2a0a'},culture:{emoji:'🎭',color:'#2a1a2a'},sports:{emoji:'⚽',color:'#1a1a3a'},opinions:{emoji:'✍️',color:'#241a2a'},podcasts:{emoji:'🎙️',color:'#1a1a3a'}};

async function pullLiveWire(opts){
  opts=opts||{};
  const silent=!!opts.silent;
  const btn=document.getElementById('btn-live');
  if(btn && !silent){ btn.disabled=true; btn.textContent='⏳…'; }
  if(btn && silent){ btn.textContent='⟳ syncing…'; }

  // Signed-in admins trigger a server-side pull; the cron does this on a
  // schedule regardless. Anonymous visitors simply refresh from the database.
  let inserted=0; let triggered=false;
  if(isAuthed() && SESSION && SESSION.access_token){
    try{
      const res=await fetch('/api/pull-wire',{ method:'POST', headers:{ 'Authorization':'Bearer '+SESSION.access_token } });
      if(res.ok){ triggered=true; const j=await res.json().catch(()=>null); if(j && typeof j.inserted==='number') inserted=j.inserted; }
    }catch(e){ /* endpoint absent (e.g. vite-only dev) → just refresh below */ }
  }

  // Pull the canonical set (incl. fresh wires) from Supabase.
  const remote=await loadStore();
  if(remote){ ARTICLES=remote; saveCache(ARTICLES); }
  localStorage.setItem('afripulse_mvp_v2_synced',Date.now().toString());

  if(btn){
    btn.disabled=false;
    btn.textContent='Pull live wire ↻';
    if(ARTICLES.some(a=>a.source==='rss')) btn.classList.add('live');
  }
  updateSyncStatus();
  if(!silent){
    if(triggered) toast(inserted>0?('Pulled '+inserted+' new wire'+(inserted===1?'':'s')+'.'):'Wire up to date.');
    else toast('Refreshed from database.');
  }
  // Re-render feed-driven views.
  const h=location.hash||'#/';
  if(h==='#/'||h==='#'||h===''||h.indexOf('#/v/')===0||h.indexOf('#/newsletter')===0){ route(); }
  return inserted;
}

function updateSyncStatus(){
  const el=document.getElementById('dev-info');
  if(!el) return;
  const raw=localStorage.getItem('afripulse_mvp_v2_synced');
  if(!raw){ el.textContent='wire idle'; return; }
  const ts=parseInt(raw,10);
  const secs=Math.floor((Date.now()-ts)/1000);
  let ago;
  if(secs<60) ago=secs+'s ago';
  else if(secs<3600) ago=Math.floor(secs/60)+'m ago';
  else ago=Math.floor(secs/3600)+'h ago';
  const wires=ARTICLES.filter(a=>a.source==='rss').length;
  el.textContent='⬤ '+wires+' wires · synced '+ago;
  el.style.color = secs<AUTO_REFRESH_MS/1000 ? '#5BC97F' : '#9A938B';
}

function startAutoRefresh(){
  if(AUTO_TIMER) clearInterval(AUTO_TIMER);
  if(!AUTO_REFRESH_MS) return;
  AUTO_TIMER=setInterval(function(){
    // Skip if tab hidden, to respect rate limits
    if(document.hidden) return;
    pullLiveWire({silent:true});
  },AUTO_REFRESH_MS);
  // Tick the "synced Xs ago" label every 15s
  setInterval(updateSyncStatus,15000);
  // When tab regains focus, refresh if stale (>AUTO_REFRESH_MS)
  document.addEventListener('visibilitychange',function(){
    if(document.hidden) return;
    const raw=localStorage.getItem('afripulse_mvp_v2_synced');
    const stale=!raw || (Date.now()-parseInt(raw,10))>AUTO_REFRESH_MS;
    if(stale) pullLiveWire({silent:true});
    else updateSyncStatus();
  });
}

// ── BOOT ──────────────────────────────────────────────────────
function boot(){
  // Apply saved language
  try{
    const saved=localStorage.getItem('afripulse_lang');
    if(saved && LANG[saved]) applyLang(saved);
  }catch(e){}

  // Skip-to-content (a11y): focus the main app region without touching the hash router.
  const skip=document.getElementById('skip-link');
  if(skip) skip.addEventListener('click',function(e){
    e.preventDefault();
    const app=document.getElementById('app');
    if(app){ app.setAttribute('tabindex','-1'); app.focus(); app.scrollIntoView(); }
  });

  const resetBtn=document.getElementById('btn-reset');
  if(resetBtn){
    resetBtn.addEventListener('click',function(){
      if(!confirm('Reset to seed library? Custom edits lost.')) return;
      ARTICLES=seedClone();
      saveStore(ARTICLES);              // cache + Supabase upsert
      localStorage.removeItem('afripulse_mvp_v2_synced');
      const liveBtn=document.getElementById('btn-live');
      if(liveBtn) liveBtn.classList.remove('live');
      toast('Reset.');
      route();
    });
  }
  const liveBtn=document.getElementById('btn-live');
  if(liveBtn) liveBtn.addEventListener('click',function(){ pullLiveWire({silent:false}); });

  window.addEventListener('hashchange',route);
  route();

  // Resolve the auth session (gates #/admin*) and refresh the article store.
  initAuth();
  // Read-through cache: the page just painted from localStorage; now refresh
  // the canonical set from Supabase (seeding the DB on first run) and re-render.
  ensureStore().then(function(list){
    if(list && list.length){ ARTICLES=list; saveCache(ARTICLES); route(); updateSyncStatus(); }
  });

  // Live feed engine: show status, schedule auto-refresh, and pull on
  // first load if we've never synced or the cache is stale.
  updateSyncStatus();
  startAutoRefresh();

  // Live African FX for the markets ticker: fetch shortly after first paint,
  // then refresh periodically (rates are daily, so a light cadence is plenty).
  setTimeout(function(){ refreshMarket(); },1500);
  setInterval(function(){ if(!document.hidden) refreshMarket(); },15*60*1000);
  try{
    const raw=localStorage.getItem('afripulse_mvp_v2_synced');
    const stale=!raw || (Date.now()-parseInt(raw,10))>AUTO_REFRESH_MS;
    if(stale){
      // Small delay so first paint isn't blocked by the network
      setTimeout(function(){ pullLiveWire({silent:true}); },1200);
    }
  }catch(e){}
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',boot);
}else{
  boot();
}
