function guessVertical(title,desc,hint){
  const text=((title||'')+' '+(desc||'')).toLowerCase();
  const scores={};
  for(const v in VKW){ scores[v]=VKW[v].reduce((s,w)=>s+(text.indexOf(w)>-1?1:0),0); }
  if(hint && scores[hint]!==undefined) scores[hint]+=0.5;
  const best=Object.keys(scores).sort((a,b)=>scores[b]-scores[a])[0];
  return scores[best]>0?best:(hint||'front');
}

function parseRSS(xml,feed){
  const items=[];
  try{
    const doc=new DOMParser().parseFromString(xml,'text/xml');
    const entries=Array.from(doc.querySelectorAll('item')).concat(Array.from(doc.querySelectorAll('entry')));
    entries.slice(0,6).forEach(e=>{
      const title=((e.querySelector('title')||{}).textContent||'').replace(/<[^>]+>/g,'').trim();
      let desc=((e.querySelector('description')||e.querySelector('summary')||{}).textContent||'').replace(/<[^>]+>/g,'').trim();
      if(desc.length>500) desc=desc.slice(0,497)+'…';
      const linkEl=e.querySelector('link');
      const link=(linkEl && (linkEl.textContent || linkEl.getAttribute('href')) || '#').trim();
      const pubEl=e.querySelector('pubDate')||e.querySelector('published')||e.querySelector('updated');
      const pub=pubEl?pubEl.textContent:null;
      if(title.length<10) return;
      const vert=guessVertical(title,desc,feed.hint);
      const def=VDEF[vert];
      items.push({
        slug:'live-'+slugify(title).slice(0,56)+'-'+Math.random().toString(36).slice(2,6),
        vertical:vert,
        kicker:(vlabel(vert))+' · '+feed.label,
        headline:title,
        standfirst:desc||title,
        byline:feed.label,
        dateline:'Wire',
        readingMin:Math.max(2,Math.ceil((desc.length||200)/600)),
        emoji:def.emoji,color:def.color,
        status:'published',
        publishedAt:pub?new Date(pub).toISOString():new Date().toISOString(),
        tags:[feed.label,'Live wire',vlabel(vert)],
        body:[desc||'Full story at source.'],
        source:'rss',sourceUrl:link,sourceLabel:feed.label
      });
    });
  }catch(e){ console.warn('parseRSS',feed.label,e); }
  return items;
}

function fetchTimeout(url,ms){
  if(typeof AbortSignal!=='undefined' && AbortSignal.timeout){
    return fetch(url,{signal:AbortSignal.timeout(ms)});
  }
  const c=new AbortController();
  setTimeout(()=>c.abort(),ms);
  return fetch(url,{signal:c.signal});
}

async function fetchFeed(feed){
  for(const wrap of PROXIES){
    try{
      const res=await fetchTimeout(wrap(feed.url),8000);
      if(!res||!res.ok) continue;
      let txt=await res.text();
      if(!txt||txt.length<80) continue;
      // allorigins /get returns JSON {contents:"..."}; unwrap it
      if(txt.charAt(0)==='{' && txt.indexOf('"contents"')>-1){
        try{ const j=JSON.parse(txt); if(j && j.contents) txt=j.contents; }catch(e){}
      }
      const items=parseRSS(txt,feed);
      if(items.length) return items;
    }catch(e){}
  }
  return [];
}

// Try the AfriPulse backend API first (reliable, server-side, no CORS).
// Returns an array of normalized articles, or null if no backend is present.
async function pullFromAPI(){
  try{
    const res=await fetchTimeout('/api/news?limit=120',8000);
    if(!res || !res.ok) return null;
    const data=await res.json();
    if(!data || !data.ok || !Array.isArray(data.articles)) return null;
    return data.articles.map(a=>{
      const vert=a.vertical||'front';
      const def=VDEF[vert]||VDEF.front;
      return {
        slug:'live-'+slugify(a.headline).slice(0,56)+'-'+Math.random().toString(36).slice(2,6),
        vertical:vert,
        kicker:a.kicker||((vlabel(vert))+' · '+(a.source||'Wire')),
        headline:a.headline,
        standfirst:a.standfirst||a.headline,
        byline:a.byline||a.source||'Wire',
        dateline:'Wire',
        readingMin:a.readingMin||3,
        emoji:def.emoji,color:def.color,
        status:'published',
        publishedAt:a.publishedAt||new Date().toISOString(),
        tags:[a.source||'Wire','Live wire',vlabel(vert)],
        body:[a.standfirst||'Full story at source.'],
        source:'rss',sourceUrl:a.sourceUrl||'#',sourceLabel:a.source||'Wire'
      };
    });
  }catch(e){ return null; }
}

async function pullLiveWire(opts){
  opts=opts||{};
  const silent=!!opts.silent;
  const btn=document.getElementById('btn-live');
  if(btn && !silent){ btn.disabled=true; btn.textContent='⏳…'; }
  if(btn && silent){ btn.textContent='⟳ syncing…'; }

  // Primary path: backend API. Fallback: public CORS proxies.
  let unique=[]; let okFeeds=0; let viaAPI=false;
  const apiArticles=await pullFromAPI();
  if(apiArticles && apiArticles.length){
    viaAPI=true; okFeeds=FEEDS.length;
    const seen=new Set();
    unique=apiArticles.filter(a=>{
      const k=a.headline.slice(0,50).toLowerCase();
      if(seen.has(k)) return false;
      seen.add(k); return true;
    });
  } else {
    const batches=await Promise.allSettled(FEEDS.map(fetchFeed));
    const incoming=[];
    batches.forEach(b=>{ if(b.status==='fulfilled' && b.value.length){ okFeeds++; incoming.push(...b.value); }});
    const seen=new Set();
    unique=incoming.filter(a=>{
      const k=a.headline.slice(0,50).toLowerCase();
      if(seen.has(k)) return false;
      seen.add(k); return true;
    });
  }
  if(unique.length){
    ARTICLES=ARTICLES.filter(a=>a.source!=='rss').concat(unique);
    if(ARTICLES.length>120){
      ARTICLES.sort((a,b)=>new Date(b.publishedAt)-new Date(a.publishedAt));
      ARTICLES=ARTICLES.slice(0,120);
    }
    // RSS articles go through the same store (cache + Supabase upsert).
    await saveStore(ARTICLES);
    localStorage.setItem('afripulse_mvp_v2_synced',Date.now().toString());
  }
  if(btn){
    btn.disabled=false;
    btn.textContent='Pull live wire ↻';
    if(unique.length) btn.classList.add('live');
  }
  updateSyncStatus();
  if(!silent){
    if(unique.length) toast('Pulled '+unique.length+' wires'+(viaAPI?' from live backend.':' from '+okFeeds+'/'+FEEDS.length+' feeds.'));
    else toast('No wires returned · retry shortly.');
  }
  // Re-render only if the user is on a feed-driven view
  const h=location.hash||'#/';
  if(unique.length && (h==='#/'||h==='#'||h===''||h.indexOf('#/v/')===0||h.indexOf('#/newsletter')===0)){
    route();
  }
  return unique.length;
}

function updateSyncStatus(){
  const el=document.getElementById('dev-info');
  if(!el) return;
  const raw=localStorage.getItem('afripulse_mvp_v2_synced');
  if(!raw){ el.textContent='wire idle'; return; }
  const ts=parseInt(raw,10);
  const secs=Math.floor((Date.now()-ts)/1000);
  let ago;
  if(secs<60) ago=secs+'s ago';
  else if(secs<3600) ago=Math.floor(secs/60)+'m ago';
  else ago=Math.floor(secs/3600)+'h ago';
  const wires=ARTICLES.filter(a=>a.source==='rss').length;
  el.textContent='⬤ '+wires+' wires · synced '+ago;
  el.style.color = secs<AUTO_REFRESH_MS/1000 ? '#5BC97F' : '#9A938B';
}

function startAutoRefresh(){
  if(AUTO_TIMER) clearInterval(AUTO_TIMER);
  if(!AUTO_REFRESH_MS) return;
  AUTO_TIMER=setInterval(function(){
    // Skip if tab hidden, to respect rate limits
    if(document.hidden) return;
    pullLiveWire({silent:true});
  },AUTO_REFRESH_MS);
  // Tick the "synced Xs ago" label every 15s
  setInterval(updateSyncStatus,15000);
  // When tab regains focus, refresh if stale (>AUTO_REFRESH_MS)
  document.addEventListener('visibilitychange',function(){
    if(document.hidden) return;
    const raw=localStorage.getItem('afripulse_mvp_v2_synced');
    const stale=!raw || (Date.now()-parseInt(raw,10))>AUTO_REFRESH_MS;
    if(stale) pullLiveWire({silent:true});
    else updateSyncStatus();
  });
}

// ── BOOT ──────────────────────────────────────────────────────
function boot(){
  // Apply saved language
  try{
    const saved=localStorage.getItem('afripulse_lang');
    if(saved && LANG[saved]) applyLang(saved);
  }catch(e){}

  const resetBtn=document.getElementById('btn-reset');
  if(resetBtn){
    resetBtn.addEventListener('click',function(){
      if(!confirm('Reset to seed library? Custom edits lost.')) return;
      ARTICLES=seedClone();
      saveStore(ARTICLES);              // cache + Supabase upsert
      localStorage.removeItem('afripulse_mvp_v2_synced');
      const liveBtn=document.getElementById('btn-live');
      if(liveBtn) liveBtn.classList.remove('live');
      toast('Reset.');
      route();
    });
  }
  const liveBtn=document.getElementById('btn-live');
  if(liveBtn) liveBtn.addEventListener('click',function(){ pullLiveWire({silent:false}); });

  window.addEventListener('hashchange',route);
  route();

  // Read-through cache: the page just painted from localStorage; now refresh
  // the canonical set from Supabase (seeding the DB on first run) and re-render.
  ensureStore().then(function(list){
    if(list && list.length){ ARTICLES=list; saveCache(ARTICLES); route(); updateSyncStatus(); }
  });

  // Live feed engine: show status, schedule auto-refresh, and pull on
  // first load if we've never synced or the cache is stale.
  updateSyncStatus();
  startAutoRefresh();
  try{
    const raw=localStorage.getItem('afripulse_mvp_v2_synced');
    const stale=!raw || (Date.now()-parseInt(raw,10))>AUTO_REFRESH_MS;
    if(stale){
      // Small delay so first paint isn't blocked by the network
      setTimeout(function(){ pullLiveWire({silent:true}); },1200);
    }
  }catch(e){}
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',boot);
}else{
  boot();
}

window.__APT={

  pullLiveWire:pullLiveWire,

  setLang:setLang,
