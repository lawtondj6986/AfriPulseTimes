<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AfriPulse Times — MVP</title>
<meta name="description" content="AfriPulse Times integrated MVP — home, articles, admin, newsletter, EN/FR/AR.">
<meta name="theme-color" content="#0D0D0D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230D0D0D'/%3E%3Ctext x='32' y='47' font-family='Georgia,serif' font-size='44' font-weight='bold' fill='%23C8401A' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0D0D0D; --bg:#F7F4EE; --bg-2:#EDE8DF; --accent:#C8401A; --accent-2:#A8330F;
  --gold:#C9A227; --muted:#6B6660; --border:#DDD8CE; --card:#fff; --green:#1E6B3A;
}
html{scroll-behavior:smooth}
html[dir="rtl"] body,html[lang="ar"] body{font-family:'Noto Naskh Arabic','DM Sans',system-ui,sans-serif}
html[dir="rtl"] .logo,html[lang="ar"] .hero-title,html[lang="ar"] .art-h1,html[lang="ar"] .sub-title,html[lang="ar"] .card-title,html[lang="ar"] .vc-title,html[lang="ar"] .rel-t,html[lang="ar"] .nl-brand,html[lang="ar"] .nl-story-t,html[lang="ar"] .vert-h,html[lang="ar"] .footer-brand{font-family:'Noto Naskh Arabic',Fraunces,serif}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font-family:inherit;font-size:inherit}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* DEV BAR (always LTR for engineering clarity) */
.devbar{background:#0a0a0a;color:#9A938B;padding:8px 18px;display:flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:11px;flex-wrap:wrap;position:sticky;top:0;z-index:100;direction:ltr;text-align:left}
.devbar-tag{background:var(--accent);color:#fff;padding:2px 8px;letter-spacing:.1em;font-weight:600}
.devbar a{color:#A09890;padding:4px 10px;border:0.5px solid #2A2520;transition:all .15s}
.devbar a:hover,.devbar a.active{background:#1A1A1A;color:#F7F4EE;border-color:#3A3530}
.devbar-spacer{flex:1}
.devbar-btn{background:none;border:0.5px solid #2A2520;color:#A09890;padding:4px 10px;cursor:pointer;font-family:inherit;font-size:11px}
.devbar-btn:hover:not(:disabled){color:#F7F4EE;border-color:#6B6660}
.devbar-btn:disabled{opacity:.4;cursor:wait}
.devbar-btn.live{color:#5BC97F;border-color:#0F6E56;background:rgba(15,110,86,.1)}
.devbar-status{color:#6B6660;font-size:10px}

/* HEADER */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 22px;height:40px;background:var(--ink);color:#F7F4EE;font-size:11px;letter-spacing:.06em;font-family:'JetBrains Mono',monospace;gap:14px;flex-wrap:wrap}
.topbar-date{color:#A09890}
.topbar-live{display:flex;align-items:center;gap:8px;color:#FF5A3C;font-weight:500}
.topbar-live .dot{width:7px;height:7px;border-radius:50%;background:#FF5A3C;animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.topbar-right{display:flex;gap:12px;align-items:center;margin-left:auto}
html[dir="rtl"] .topbar-right{margin-left:0;margin-right:auto}
.topbar-right .lang-link{color:#7A7470;cursor:pointer;font-family:'DM Sans',sans-serif;letter-spacing:.04em;padding:4px 8px;border:0.5px solid transparent;transition:all .15s;font-weight:500}
.topbar-right .lang-link:hover{color:#fff;border-color:#3A3530}
.topbar-right .lang-link.active{color:#fff;background:var(--accent);border-color:var(--accent)}
.topbar-right a{color:#A09890;cursor:pointer;font-family:'DM Sans',sans-serif;letter-spacing:.04em}
.topbar-right a:hover{color:#fff}
.topbar-right .btn-sub{background:var(--accent);color:#fff !important;padding:5px 13px;font-weight:500}
.topbar-right .btn-sub:hover{background:var(--accent-2)}
.masthead{padding:24px 22px 14px;border-bottom:3px solid var(--ink);background:var(--bg);display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.logo{font-family:'Fraunces',serif;font-size:50px;font-weight:900;letter-spacing:-2px;line-height:.95;cursor:pointer}
.logo .pulse{color:var(--accent);font-style:italic}
.logo .times{color:var(--muted);font-style:italic;font-weight:400}
.tagline{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:6px;font-weight:500}
html[lang="ar"] .tagline{letter-spacing:0;font-size:12px;text-transform:none}
.masthead-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
html[dir="rtl"] .masthead-right{align-items:flex-start}
.social-links{display:flex;gap:6px;align-items:center}
.social-links a{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--muted);background:transparent;border:0.5px solid var(--border);border-radius:50%;transition:all .18s ease;text-decoration:none}
.social-links a:hover,.social-links a:focus-visible{color:#fff;background:var(--accent);border-color:var(--accent);transform:translateY(-1px)}
.social-links a svg{width:14px;height:14px;fill:currentColor;display:block}
.social-links a .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.search-bar{display:flex;align-items:center;gap:10px;border:0.5px solid var(--border);padding:9px 14px;background:var(--card)}
.search-bar input{border:none;outline:none;font-size:13px;width:200px;background:transparent}
.nav{display:flex;padding:0 22px;border-bottom:0.5px solid var(--border);background:var(--bg);overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:13px 16px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;color:var(--muted)}
html[lang="ar"] .nav a{letter-spacing:0;font-size:13px;text-transform:none}
.nav a.active{color:var(--accent);border-bottom-color:var(--accent)}
.nav a:hover{color:var(--ink)}
.nav a.nav-journalists{margin-left:auto;font-style:italic;color:var(--ink);font-weight:600;border-left:0.5px solid var(--border);padding-left:24px}
html[dir="rtl"] .nav a.nav-journalists{margin-left:0;margin-right:auto;border-left:none;border-right:0.5px solid var(--border);padding-left:16px;padding-right:24px}
.nav a.nav-journalists::before{content:'✦';color:var(--accent);margin-right:6px;font-style:normal;font-size:13px;vertical-align:1px}
html[dir="rtl"] .nav a.nav-journalists::before{margin-right:0;margin-left:6px}

/* JOURNALISTS — index + profile */
.jr-head{padding:28px 22px;background:var(--bg);border-bottom:0.5px solid var(--border)}
.jr-head .label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:8px}
.jr-head h2{font-family:'Fraunces',serif;font-size:36px;font-weight:900;letter-spacing:-1px;margin-bottom:6px}
.jr-head .sub{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.jr-grid{padding:22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;background:var(--bg)}
.jr-card{background:var(--card);border:0.5px solid var(--border);padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:transform .2s}
.jr-card:hover{transform:translateY(-2px);border-color:var(--accent)}
.jr-avatar{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Fraunces',serif;font-weight:900;font-size:24px;letter-spacing:-1px;flex-shrink:0}
.jr-card-top{display:flex;align-items:center;gap:14px}
.jr-name{font-family:'Fraunces',serif;font-size:18px;font-weight:900;line-height:1.1;letter-spacing:-.5px;color:var(--ink)}
.jr-beat{font-size:11px;color:var(--accent);letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-top:4px}
.jr-meta{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;display:flex;gap:10px;flex-wrap:wrap}
.jr-bio{font-size:13px;color:var(--ink);line-height:1.55}
.jr-stat{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;border-top:0.5px solid var(--border);padding-top:8px;margin-top:auto;display:flex;justify-content:space-between}
.jr-stat .count{color:var(--accent);font-weight:700;font-family:'Fraunces',serif;font-size:14px;font-style:italic}

/* JOURNALIST PROFILE */
.jr-profile{background:var(--bg);padding:32px 22px 24px}
.jr-profile-grid{display:grid;grid-template-columns:240px 1fr;gap:32px;max-width:1100px;margin:0 auto;align-items:start}
.jr-profile-left{text-align:center}
.jr-profile-avatar{width:160px;height:160px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Fraunces',serif;font-weight:900;font-size:56px;letter-spacing:-2px;margin:0 auto 16px}
.jr-profile-meta{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;line-height:1.7}
.jr-profile-meta .label{color:var(--ink);font-weight:500;font-family:'DM Sans',sans-serif}
.jr-profile-right h2{font-family:'Fraunces',serif;font-size:42px;font-weight:900;letter-spacing:-1.5px;margin-bottom:6px;line-height:1}
.jr-profile-right .beat{font-size:12px;color:var(--accent);letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:18px}
.jr-profile-right .bio{font-family:'Fraunces',serif;font-size:18px;line-height:1.6;color:var(--ink);margin-bottom:18px;font-style:italic}
.jr-stories-head{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:18px 22px 10px;border-top:1px solid var(--border);background:var(--bg)}
.jr-stories{padding:0 22px 32px;background:var(--bg);display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}

/* ARTICLE MEDIA (hero image / video) */
.art-media{margin:18px 22px 0;background:var(--ink);overflow:hidden;border:0.5px solid var(--border);position:relative}
.art-media img{display:block;width:100%;height:auto;max-height:440px;object-fit:cover}
.art-media .video-wrap{position:relative;padding-bottom:56.25%;height:0;overflow:hidden}
.art-media .video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
.art-media .placeholder{height:280px;display:flex;align-items:center;justify-content:center;font-size:140px;opacity:.45;position:relative;overflow:hidden}
.art-media .placeholder::after{content:attr(data-emoji);text-shadow:0 10px 30px rgba(0,0,0,.5)}
.art-media-caption{padding:10px 16px;background:var(--bg-2);font-size:12px;color:var(--ink);line-height:1.5;border-top:0.5px solid var(--border);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.art-media-caption .credit{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;flex-shrink:0}

/* SCROLLING TICKER (under verticals) */
.ticker{background:var(--ink);color:#C0BBB4;display:flex;align-items:center;height:42px;overflow:hidden;border-bottom:2px solid var(--accent);direction:ltr}
.ticker-badge{background:var(--accent);color:#fff;padding:0 18px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;display:flex;align-items:center;gap:8px;height:100%;flex-shrink:0;white-space:nowrap}
.ticker-badge .d{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1.4s infinite;flex-shrink:0}
.ticker-wrap{flex:1;overflow:hidden;position:relative}
.ticker-wrap::before,.ticker-wrap::after{content:'';position:absolute;top:0;bottom:0;width:48px;z-index:3;pointer-events:none}
.ticker-wrap::before{left:0;background:linear-gradient(to right,var(--ink),transparent)}
.ticker-wrap::after{right:0;background:linear-gradient(to left,var(--ink),transparent)}
.ticker-track{display:flex;align-items:center;height:100%;animation:tickerScroll 60s linear infinite;white-space:nowrap}
.ticker-track:hover{animation-play-state:paused}
@keyframes tickerScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ti{display:inline-flex;align-items:center;gap:10px;padding:0 22px;border-right:1px solid #1A1A1A;font-size:12px;height:100%;color:#C0BBB4;flex-shrink:0;text-decoration:none}
.ti:hover{background:#161410}
.ti-region{background:rgba(46,125,50,.25);color:#81C784;font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:2px 7px;font-weight:600}
.ti-title{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ti-src{color:#6A645E;font-family:'JetBrains Mono',monospace;font-size:10px}

/* COMMODITIES BAR */
.com-bar{background:#1A1813;color:#E8E3DC;display:flex;align-items:center;height:36px;overflow:hidden;border-bottom:0.5px solid var(--border);direction:ltr}
.com-label{background:var(--gold);color:var(--ink);padding:0 16px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;display:flex;align-items:center;height:100%;flex-shrink:0;white-space:nowrap}
.com-wrap{flex:1;overflow:hidden;position:relative}
.com-wrap::before,.com-wrap::after{content:'';position:absolute;top:0;bottom:0;width:32px;z-index:3;pointer-events:none}
.com-wrap::before{left:0;background:linear-gradient(to right,#1A1813,transparent)}
.com-wrap::after{right:0;background:linear-gradient(to left,#1A1813,transparent)}
.com-track{display:flex;align-items:center;height:100%;animation:tickerScroll 90s linear infinite;white-space:nowrap}
.com-track:hover{animation-play-state:paused}
.com-item{padding:0 22px;display:flex;align-items:center;gap:10px;border-right:1px solid #2A2620;font-family:'JetBrains Mono',monospace;font-size:12px;flex-shrink:0;height:100%}
.com-name{color:#9A938B}
.com-chg.up{color:#5BC97F}
.com-chg.dn{color:#FF6B5C}

/* HOME */
.hero{padding:30px 22px 14px;background:var(--bg)}
.hero-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:1px;background:var(--border);border:0.5px solid var(--border);margin-bottom:24px}
.hero-main{background:var(--card);cursor:pointer;display:flex;flex-direction:column}
.hero-main:hover{background:#FBF8F2}
.hero-img{height:260px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:18px}
.hero-img::after{content:attr(data-emoji);position:absolute;right:-30px;top:-60px;font-size:220px;opacity:.1;line-height:1;pointer-events:none}
.hero-cat{background:var(--accent);color:#fff;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:5px 12px;font-weight:700;position:relative;z-index:1}
.hero-body{padding:20px 24px 22px}
.hero-kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;font-weight:600}
.hero-title{font-family:'Fraunces',serif;font-size:28px;font-weight:900;line-height:1.1;letter-spacing:-1px;margin-bottom:12px}
.hero-ex{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:10px}
.hero-meta{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;display:flex;gap:12px;flex-wrap:wrap}
.hero-meta .by{color:var(--ink);font-weight:500;font-family:'DM Sans',sans-serif}
.hero-subs{display:flex;flex-direction:column;background:var(--border)}
.sub{background:var(--card);padding:14px 18px;flex:1;cursor:pointer;border-bottom:0.5px solid var(--border)}
.sub:last-child{border-bottom:none}
.sub:hover{background:#FBF8F2}
.sub-cat{font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:5px}
.sub-title{font-family:'Fraunces',serif;font-size:14px;font-weight:700;line-height:1.3;margin-bottom:4px}
.sub-meta{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.main{display:grid;grid-template-columns:230px 1fr 240px;gap:0;padding:0 22px 32px;background:var(--bg)}
.feed{padding:0 24px}
html[dir="rtl"] .feed{padding:0 24px}

/* LEFT RAIL — by-vertical archive aggregator */
.left-rail{padding-right:18px;border-right:0.5px solid var(--border)}
html[dir="rtl"] .left-rail{padding-right:0;padding-left:18px;border-right:none;border-left:0.5px solid var(--border)}
.lr-head{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:6px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.lr-head .lr-total{color:var(--accent);font-family:'JetBrains Mono',monospace;font-weight:600}
.lr-vert{padding:8px 0 6px}
.lr-vert-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent);padding:6px 0;cursor:pointer;border-top:1px solid var(--border)}
.lr-vert:first-child .lr-vert-head{border-top:none}
.lr-vert-head:hover{color:var(--accent-2)}
.lr-vert-head .arrow{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);font-weight:400;letter-spacing:0;transition:transform .2s}
.lr-vert-head .arrow.open{transform:rotate(90deg)}
.lr-vert-count{background:var(--bg-2);color:var(--ink);padding:1px 6px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;border-radius:2px;margin-left:6px}
html[dir="rtl"] .lr-vert-count{margin-left:0;margin-right:6px}
.lr-list{display:none;padding:2px 0 4px}
.lr-list.open{display:block}
.lr-art{display:block;padding:7px 0;cursor:pointer;border-bottom:0.5px dotted var(--border)}
.lr-art:last-child{border-bottom:none}
.lr-art:hover .lr-art-title{color:var(--accent)}
.lr-art-title{font-family:'Fraunces',serif;font-weight:700;font-size:12.5px;line-height:1.3;color:var(--ink);margin-bottom:3px}
.lr-art-meta{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;display:flex;justify-content:space-between;align-items:center;gap:6px}
.lr-art-meta .live-badge{background:rgba(229,72,77,.15);color:#E5484D;padding:1px 4px;border-radius:2px;font-size:9px;letter-spacing:.04em}
.lr-viewall{display:block;font-size:10px;color:var(--accent);font-family:'JetBrains Mono',monospace;letter-spacing:.06em;margin-top:8px;padding:6px 0;cursor:pointer;text-align:left;font-weight:600}
.lr-viewall:hover{text-decoration:underline}
.lr-empty{font-size:11px;color:var(--muted);font-style:italic;padding:8px 0;font-family:'Fraunces',serif}
.lr-toggle-all{font-size:10px;color:var(--accent);font-family:'JetBrains Mono',monospace;letter-spacing:.06em;cursor:pointer;padding:4px 8px;border:0.5px solid var(--border);background:transparent;font-weight:500}
.lr-toggle-all:hover{background:var(--bg-2);border-color:var(--accent)}
.lr-section-divider{height:2px;background:var(--ink);margin:18px 0 14px;position:relative}
.lr-section-divider::after{content:'❖';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--bg);padding:0 6px;color:var(--accent);font-size:11px}
.lr-region-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink);padding:7px 0;cursor:pointer;border-top:1px solid var(--border)}
.lr-region-head:first-of-type{border-top:none}
.lr-region-head:hover{color:var(--accent)}
.lr-region-head .flag{margin-right:6px;font-style:normal;font-size:13px}
html[dir="rtl"] .lr-region-head .flag{margin-right:0;margin-left:6px}
.lr-region-head .lr-vert-count{background:#0e2818;color:#fff}
.feed-head{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:4px;font-weight:700;display:flex;justify-content:space-between}
.card{display:grid;grid-template-columns:80px 1fr;gap:14px;padding:14px 0;border-bottom:0.5px solid var(--border);cursor:pointer}
.card:hover{opacity:.72}
.card-thumb{width:80px;height:64px;display:flex;align-items:center;justify-content:center;font-size:30px;opacity:.6}
.card-cat{font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:4px;display:flex;justify-content:space-between}
.card-cat .r{color:var(--muted);font-weight:400;font-family:'JetBrains Mono',monospace}
.card-title{font-family:'Fraunces',serif;font-size:14px;font-weight:700;line-height:1.3;margin-bottom:3px}
.card-meta{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.card-url{font-size:10px;color:#0F6E56;font-family:'JetBrains Mono',monospace;margin-top:3px;direction:ltr}
.empty{padding:40px 8px;text-align:center;color:var(--muted);font-family:'Fraunces',serif;font-style:italic}
.rpanel{padding-left:22px;border-left:0.5px solid var(--border);padding-top:0}
html[dir="rtl"] .rpanel{padding-left:0;padding-right:22px;border-left:none;border-right:0.5px solid var(--border)}
.panel-head{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding-bottom:8px;border-bottom:0.5px solid var(--border);margin-bottom:8px;font-weight:700;margin-top:18px}
.panel-head:first-child{margin-top:0}
.mrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:0.5px solid var(--border);font-size:11px;font-family:'JetBrains Mono',monospace}
.mrow .n{color:var(--muted)}
.mrow .v{font-weight:600}
.mrow.region-row{transition:background .15s;padding:7px 6px;margin:0 -6px;border-radius:2px}
.mrow.region-row:hover{background:var(--bg-2)}
.mrow.region-row:hover .n{color:var(--ink)}
.mrow.region-row .n{font-family:'DM Sans',sans-serif;font-size:12px;letter-spacing:0;display:flex;align-items:center;gap:6px}
.mrow.region-row .v{color:var(--accent);font-size:12px}
.mrow.region-row .flag{font-size:13px;font-family:'DM Sans',sans-serif}
.up{color:var(--green)}
.dn{color:var(--accent)}

/* ARTICLE */
.art-back{display:inline-block;padding:14px 22px;font-size:11px;color:var(--accent);background:var(--bg);cursor:pointer}
.article{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:0;background:var(--bg);padding:0 22px 24px}
.art-body{padding:8px 24px 24px 0;min-width:0}
html[dir="rtl"] .art-body{padding:8px 0 24px 24px}
.art-kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:12px}
.art-h1{font-family:'Fraunces',serif;font-size:34px;font-weight:900;line-height:1.1;letter-spacing:-1px;margin-bottom:16px;color:var(--ink)}
.art-meta{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--border)}
.art-meta .by{color:var(--ink);font-weight:500;font-family:'DM Sans',sans-serif}
.art-lead{font-family:'Fraunces',serif;font-size:17px;line-height:1.5;color:var(--ink);font-weight:500;margin-bottom:16px}
.art-body p{font-size:15px;line-height:1.75;color:var(--ink);margin-bottom:14px}
.art-source{margin-top:18px;padding:14px 16px;background:rgba(229,72,77,.08);border-left:3px solid #E5484D;font-size:13px;line-height:1.5}
.art-source a{color:var(--accent);font-weight:500}
.art-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.art-tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:var(--bg-2);padding:5px 10px;font-weight:500}
.art-note{margin-top:22px;padding:14px 16px;background:var(--bg-2);border-left:3px solid var(--gold);font-size:12px;color:var(--muted);line-height:1.5}
.art-lang-note{margin-top:14px;padding:10px 14px;background:rgba(46,124,247,.08);border-left:3px solid #2E7CF7;font-size:12px;color:var(--muted);line-height:1.5}
.art-side{padding:8px 0 0 22px;border-left:0.5px solid var(--border)}
html[dir="rtl"] .art-side{padding:8px 22px 0 0;border-left:none;border-right:0.5px solid var(--border)}
.data-row{margin-bottom:14px}
.data-label{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:3px}
.data-val{font-size:18px;font-weight:600;font-family:'JetBrains Mono',monospace}
.data-chg{font-size:11px;font-family:'JetBrains Mono',monospace;margin-top:2px}
.related{padding:24px 22px;background:var(--bg);border-top:1px solid var(--border)}
.rel-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:10px}
.rel{cursor:pointer}
.rel:hover .rel-t{color:var(--accent)}
.rel-cat{font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-bottom:4px}
.rel-t{font-family:'Fraunces',serif;font-size:14px;font-weight:700;line-height:1.3}
.rel-url{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:3px;direction:ltr}

/* VERTICAL */
.vert-head{padding:24px 22px;background:var(--bg);border-bottom:0.5px solid var(--border)}
.vert-h{font-family:'Fraunces',serif;font-size:36px;font-weight:900;letter-spacing:-1px}
.vert-sub{font-size:12px;color:var(--muted);margin-top:6px;font-family:'JetBrains Mono',monospace}
.vert-grid{padding:22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;background:var(--bg)}
.vert-card{background:var(--card);border:0.5px solid var(--border);padding:0;cursor:pointer;display:flex;flex-direction:column}
.vert-card:hover{transform:translateY(-2px);transition:transform .2s}
.vc-thumb{height:110px;display:flex;align-items:flex-end;padding:12px;position:relative;overflow:hidden}
.vc-thumb::after{content:attr(data-emoji);position:absolute;right:-15px;top:-25px;font-size:120px;opacity:.12}
.vc-cat{background:var(--accent);color:#fff;font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;font-weight:700;position:relative;z-index:1}
.vc-body{padding:14px 16px}
.vc-title{font-family:'Fraunces',serif;font-size:15px;font-weight:700;line-height:1.25;margin-bottom:8px}
.vc-meta{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace}

/* ADMIN (always LTR — code/editorial workflow stays in source orientation) */
.admin{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 38px);background:#101112;color:#E4E6E8;font-family:'Inter','DM Sans',sans-serif;direction:ltr;text-align:left}
.adm-list{background:#191B1D;border-right:1px solid #2A2D31;overflow-y:auto}
.adm-list-head{padding:14px 16px;border-bottom:1px solid #2A2D31;display:flex;justify-content:space-between;align-items:center}
.adm-list-title{font-size:13px;font-weight:600}
.adm-new-btn{background:var(--accent);color:#fff;border:none;width:28px;height:28px;border-radius:4px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.adm-filter{padding:8px 16px;border-bottom:1px solid #2A2D31}
.adm-filter input{width:100%;background:#222528;border:1px solid #2A2D31;color:#E4E6E8;padding:7px 10px;border-radius:4px;font-size:12px}
.adm-doc{padding:12px 16px;border-bottom:1px solid #2A2D31;cursor:pointer;border-left:3px solid transparent}
.adm-doc:hover{background:#222528}
.adm-doc.active{background:#222528;border-left-color:var(--accent)}
.adm-doc-title{font-size:13px;font-weight:500;line-height:1.4;margin-bottom:4px}
.adm-doc-meta{font-size:11px;color:#5F6469;display:flex;gap:8px;flex-wrap:wrap}
.adm-status{font-size:10px;padding:2px 6px;border-radius:3px;font-weight:500}
.s-pub{background:rgba(34,160,107,.18);color:#22A06B}
.s-draft{background:rgba(232,149,77,.18);color:#E8954D}
.s-live{background:rgba(229,72,77,.18);color:#E5484D}
.s-live::before{content:'\25CF\00A0';font-size:8px}
.adm-pane{background:#101112;overflow-y:auto;padding:0}
.adm-bar{padding:12px 24px;border-bottom:1px solid #2A2D31;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:#101112;z-index:5}
.adm-crumb{font-size:12px;color:#5F6469}
.adm-crumb .cur{color:#E4E6E8}
.adm-actions{margin-left:auto;display:flex;gap:8px}
.adm-btn{padding:7px 14px;font-size:12px;font-weight:500;border-radius:4px;cursor:pointer;border:1px solid #2A2D31;background:#222528;color:#E4E6E8}
.adm-btn:hover{background:#2A2D31}
.adm-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.adm-btn.primary:hover{background:var(--accent-2)}
.adm-btn.danger{color:#E5484D;background:transparent}
.adm-form{padding:24px 28px 36px;max-width:780px}
.adm-field{margin-bottom:18px}
.adm-label{font-size:12px;font-weight:500;color:#9AA0A6;margin-bottom:6px;display:flex;justify-content:space-between}
.adm-label .help{font-size:11px;color:#5F6469;font-weight:400}
.adm-input{width:100%;background:#1A1C1E;border:1px solid #2A2D31;color:#E4E6E8;padding:9px 12px;font-size:14px;border-radius:4px;font-family:inherit}
.adm-input:focus{border-color:var(--accent);outline:none}
.adm-input.title{font-family:'Fraunces',serif;font-size:22px;font-weight:700;line-height:1.2}
.adm-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.adm-textarea{min-height:200px;resize:vertical;line-height:1.7}
.adm-slug{background:#1A1C1E;border:1px solid #2A2D31;border-radius:4px;padding:8px 12px;font-size:12px;color:#9AA0A6;font-family:'JetBrains Mono',monospace;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.adm-slug .u{color:var(--accent);margin-left:auto}
.adm-welcome{padding:32px}
.adm-welcome h2{font-family:'Fraunces',serif;font-size:28px;font-weight:900;letter-spacing:-.5px;margin-bottom:8px}
.adm-welcome p{color:#9AA0A6;font-size:14px;line-height:1.6;margin-bottom:18px;max-width:600px}
.adm-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:600px;margin-bottom:22px}
.adm-stat{background:#1A1C1E;border:1px solid #2A2D31;border-radius:6px;padding:14px 18px}
.adm-stat-label{font-size:11px;color:#9AA0A6;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.adm-stat-val{font-family:'Fraunces',serif;font-size:32px;font-weight:900}

/* NEWSLETTER */
.nl-stage{background:#D8D3C9;padding:24px;min-height:calc(100vh - 38px)}
.nl-client{max-width:680px;margin:0 auto;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.nl-bar{background:#F3F1EC;padding:10px 18px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.nl-bar .f{color:var(--ink);font-weight:500}
.nl-email{background:var(--bg);max-width:600px;margin:0 auto}
.nl-head{padding:22px 28px 14px;border-bottom:3px solid var(--ink)}
.nl-kicker{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-family:'JetBrains Mono',monospace;display:flex;justify-content:space-between;margin-bottom:8px}
.nl-brand{font-family:'Fraunces',serif;font-size:32px;font-weight:900;letter-spacing:-1.5px}
.nl-brand .pulse{color:var(--accent);font-style:italic}
.nl-brand .times{color:var(--muted);font-style:italic;font-weight:400}
.nl-sub{font-family:'Fraunces',serif;font-size:13px;color:var(--muted);font-style:italic;margin-top:4px}
.nl-intro{padding:18px 28px;background:#fff;border-bottom:0.5px solid var(--border)}
.nl-intro p{font-size:14px;line-height:1.7;margin-bottom:8px}
.nl-greet{font-family:'Fraunces',serif;font-size:16px}
.nl-greet em{color:var(--accent);font-style:italic}
.nl-sect{padding:20px 28px;background:var(--bg)}
.nl-sect-h{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:10px}
.nl-story{padding:12px 0;border-bottom:0.5px solid var(--border);cursor:pointer}
.nl-story:last-child{border-bottom:none}
.nl-story-cat{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px}
.nl-story-t{font-family:'Fraunces',serif;font-size:16px;font-weight:700;line-height:1.2;margin-bottom:6px}
.nl-story-s{font-size:13px;line-height:1.55;color:var(--ink);margin-bottom:6px}
.nl-numbers{background:var(--ink);color:#E8E3DC;padding:18px 28px}
.nl-numbers .nl-sect-h{color:#7A7470;border-bottom-color:#1A1A1A}
.num-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.num-cell{padding:4px 0}
.num-label{font-size:11px;color:#7A7470;font-family:'JetBrains Mono',monospace;margin-bottom:3px}
.num-val{font-size:16px;font-weight:600;font-family:'JetBrains Mono',monospace;color:#F7F4EE}
.num-chg{font-size:11px;font-family:'JetBrains Mono',monospace}
.num-chg.up{color:#5BC97F}
.num-chg.dn{color:#FF6B5C}
.nl-foot{padding:18px 28px;background:var(--ink);color:#A09890;font-size:11px;text-align:center;line-height:1.6}
.nl-foot-b{font-family:'Fraunces',serif;font-size:18px;color:#F7F4EE;font-weight:900;margin-bottom:6px}
.nl-foot-b .pulse{color:var(--accent);font-style:italic}

/* INVESTOR / FUNDER CTA */
.investor-cta{background:var(--accent);color:#fff;padding:60px 22px 56px;position:relative;overflow:hidden;margin-top:24px}
.investor-cta::before{content:'';position:absolute;top:-120px;right:-120px;width:420px;height:420px;border:1px solid rgba(255,255,255,.10);border-radius:50%;pointer-events:none}
.investor-cta::after{content:'';position:absolute;top:-70px;right:-70px;width:300px;height:300px;border:1px solid rgba(255,255,255,.08);border-radius:50%;pointer-events:none}
.investor-inner{max-width:1100px;margin:0 auto;position:relative;z-index:1;display:grid;grid-template-columns:1.4fr 1fr;gap:48px;align-items:center}
.investor-eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.72);font-weight:700;margin-bottom:14px;font-family:'JetBrains Mono',monospace}
.investor-h{font-family:'Fraunces',serif;font-size:46px;font-weight:900;letter-spacing:-1.5px;line-height:1.05;margin-bottom:18px;color:#fff}
.investor-h em{font-style:italic;font-weight:400;color:rgba(255,255,255,.85);display:block;font-size:38px;margin-top:2px}
.investor-lead{font-size:15px;line-height:1.65;color:rgba(255,255,255,.92);max-width:540px;margin-bottom:22px}
.investor-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:520px;margin-bottom:26px;border-top:1px solid rgba(255,255,255,.18);border-bottom:1px solid rgba(255,255,255,.18);padding:18px 0}
.investor-stat .num{font-family:'Fraunces',serif;font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1;font-style:italic}
.investor-stat .label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-top:6px;font-weight:600}
.investor-ctas{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.investor-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45);padding:13px 22px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;text-decoration:none;transition:all .18s ease;cursor:pointer;font-family:inherit;display:inline-block}
.investor-btn:hover{background:rgba(255,255,255,.12);border-color:#fff}
.investor-btn.primary{background:#fff;color:var(--accent);border-color:#fff}
.investor-btn.primary:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.investor-note{font-size:11px;color:rgba(255,255,255,.6);font-family:'JetBrains Mono',monospace;letter-spacing:.04em;margin-top:14px}
.investor-card{background:rgba(0,0,0,.20);padding:32px;border:1px solid rgba(255,255,255,.18)}
.investor-card .pill{display:inline-block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;background:rgba(255,255,255,.15);padding:5px 11px;font-weight:700;margin-bottom:14px;color:#fff}
.investor-card .email-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-bottom:6px;font-weight:600}
.investor-card .email{font-family:'Fraunces',serif;font-size:22px;color:#fff;font-weight:700;text-decoration:none;letter-spacing:-.5px;display:block;margin-bottom:18px}
.investor-card .email:hover{text-decoration:underline}
.investor-card .meta{font-size:11px;color:rgba(255,255,255,.62);line-height:1.7;font-family:'JetBrains Mono',monospace;letter-spacing:.04em}
@media (max-width:880px){.investor-inner{grid-template-columns:1fr;gap:24px}.investor-h{font-size:32px}.investor-h em{font-size:26px}}

/* ADVERTISING SLOT PLACEHOLDERS */
.ad-slot{position:relative;background:repeating-linear-gradient(45deg,var(--bg) 0,var(--bg) 10px,var(--bg-2) 10px,var(--bg-2) 20px);border:1px dashed var(--border);padding:18px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:18px 22px 0}
.ad-slot .ad-label{position:absolute;top:-9px;left:14px;background:var(--bg);color:var(--muted);padding:0 8px;font-size:9px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;font-family:'JetBrains Mono',monospace}
.ad-slot .ad-content{flex:1;min-width:200px}
.ad-slot .ad-title{font-family:'Fraunces',serif;font-size:18px;font-weight:900;letter-spacing:-.5px;color:var(--ink);line-height:1.2;font-style:italic}
.ad-slot .ad-sub{font-size:12px;color:var(--muted);line-height:1.55;margin-top:4px}
.ad-slot .ad-cta{background:var(--ink);color:#fff;padding:10px 18px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;cursor:pointer;text-decoration:none;transition:background .15s;white-space:nowrap}
.ad-slot .ad-cta:hover{background:var(--accent)}
.ad-slot-mini{display:block;padding:14px 12px;margin:0 -6px;background:var(--bg-2);border:1px dashed var(--border)}
.ad-slot-mini .ad-label{position:relative;top:auto;left:auto;background:transparent;display:block;padding:0;margin-bottom:6px;font-size:9px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;font-weight:700;font-family:'JetBrains Mono',monospace}
.ad-slot-mini .ad-title{font-family:'Fraunces',serif;font-size:13px;font-weight:700;letter-spacing:0;color:var(--ink);line-height:1.3;font-style:italic;margin-bottom:4px}
.ad-slot-mini .ad-sub{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:8px}
.ad-slot-mini .ad-cta{display:inline-block;background:transparent;color:var(--accent);padding:0;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;cursor:pointer;text-decoration:none;border:none;font-family:'JetBrains Mono',monospace}
.ad-slot-mini .ad-cta:hover{text-decoration:underline}

/* FOOTER */
.footer{background:var(--ink);color:#A09890;padding:38px 22px 18px;margin-top:0;border-top:1px solid #1A1A1A}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:32px;max-width:1100px;margin:0 auto 24px}
.footer-brand{font-family:'Fraunces',serif;font-size:28px;color:#F7F4EE;font-weight:900;margin-bottom:8px}
.footer-brand .pulse{color:var(--accent);font-style:italic}
.footer-brand .times{color:#9A938B;font-style:italic;font-weight:400}
.footer-desc{font-size:12px;line-height:1.6;color:#B0ABA5;max-width:260px}
.footer h4{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9A938B;margin-bottom:10px;font-weight:700}
.footer a{display:block;font-size:13px;color:#B0ABA5;margin-bottom:6px;cursor:pointer}
.footer a:hover{color:#F7F4EE}
.footer-bot{max-width:1100px;margin:0 auto;border-top:1px solid #1A1A1A;padding-top:14px;font-size:11px;color:#8B857C;font-family:'JetBrains Mono',monospace;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(160%);background:var(--ink);color:#F7F4EE;padding:13px 20px;font-size:13px;z-index:300;border-left:3px solid var(--accent);box-shadow:0 12px 40px rgba(0,0,0,.35);transition:transform .35s ease;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}

@media (max-width:1080px){
  .main{grid-template-columns:1fr 240px}
  .left-rail{display:none}
}
@media (max-width:880px){
  .hero-grid,.article,.main,.admin{grid-template-columns:1fr}
  .adm-list{display:none}
  .footer-grid{grid-template-columns:1fr}
  .feed,html[dir="rtl"] .feed{padding:0}
  .rpanel,.art-side,html[dir="rtl"] .rpanel,html[dir="rtl"] .art-side{padding:18px 0 0;border:none;border-top:0.5px solid var(--border);margin-top:18px}
  .left-rail,html[dir="rtl"] .left-rail{display:block;padding:18px 0;border:none;border-top:0.5px solid var(--border);margin-top:18px}
  .adm-grid{grid-template-columns:1fr}
  .ti-title{max-width:240px}
}
@media (max-width:600px){
  .logo{font-size:38px}
  .hero-title,.art-h1,.vert-h{font-size:24px}
}
@media (prefers-reduced-motion: reduce){

let CURRENT_LANG = 'en';
function t(key){
  const parts = key.split('.');
  let v = LANG[CURRENT_LANG] || LANG.en;
  for(const p of parts){
    if(v && typeof v === 'object' && p in v) v = v[p];
    else { v = null; break; }
  }
  if(v != null) return v;
  // Fallback to English
  v = LANG.en;
  for(const p of parts){
    if(v && typeof v === 'object' && p in v) v = v[p];
    else return key;
  }
  return v;
}
function vlabel(v){ return t('vert.'+v) || v; }
function vshort(v){ return t('vert_short.'+v) || v; }

function applyLang(code){
  if(!LANG[code]) return false;
  CURRENT_LANG = code;
  try{
    document.documentElement.lang = code;
    document.documentElement.dir = (code === 'ar') ? 'rtl' : 'ltr';
  }catch(e){}
  return true;
}

function setLang(code){
  if(!applyLang(code)) return;
  try{ localStorage.setItem('afripulse_lang', code); }catch(e){}
  toast(code==='en'?'English':code==='fr'?'Français':'العربية');
  route();
}

function articleMatchesRegion(article, regionSlug){
  const r=REGIONS[regionSlug];
  if(!r) return false;
  const tags=(article.tags||[]).map(s=>String(s).toLowerCase());
  const dl=String(article.dateline||'').toLowerCase();
  for(const c of r.countries){
    const cl=c.toLowerCase();
    if(tags.indexOf(cl)>-1) return true;
    if(dl===cl || dl.indexOf(cl)>-1) return true;
  }
  for(const cap of (r.capitals||[])){
    if(dl.indexOf(cap.toLowerCase())>-1) return true;
  }
  return false;
}
function byRegion(slug){
  return published().filter(a=>articleMatchesRegion(a,slug));
}
function rlabel(slug){
  const key = slug.replace(/-/g,'_');
  const tr = t(key);
  return tr !== key ? tr : (REGIONS[slug] ? REGIONS[slug].label : slug);
}

// ── STORAGE ───────────────────────────────────────────────────
// Articles live in Supabase (Postgres). localStorage is a read-through cache:
// the site paints instantly from the cache on load, then refreshes from the
// database. Writes update the cache write-through and push to Supabase.
const KEY='afripulse_mvp_v2';

// Supabase client handed over by /supabase-config.js. Null until ready (we race
// a timeout so a blocked CDN/config can't hang the boot path indefinitely).
let SUPA=null;
async function ensureSupabase(){
  if(SUPA) return SUPA;
  try{
    SUPA = await Promise.race([
      (window.__supabaseReady||Promise.resolve(null)),
      new Promise(function(r){ setTimeout(function(){ r(null); },6000); })
    ]);
  }catch(e){ SUPA=null; }
  return SUPA;
}

// Light normalisation kept from the old localStorage migration path.
function normalize(list){
  (list||[]).forEach(a=>{
    if(!a.source) a.source='authored';
    if(a.vertical==='voices') a.vertical='opinions'; // legacy → Opinions
  });
  return list||[];
}
function seedClone(){
  const s=JSON.parse(JSON.stringify(SEED));
  s.forEach(a=>{ a.source='authored'; });
  return s;
}

// --- localStorage read-through cache (synchronous, for instant first paint) ---
function loadCache(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw) return null;
    const data=JSON.parse(raw);
    return Array.isArray(data) && data.length ? data : null;
  }catch(e){ return null; }
}
function saveCache(arr){
  try{ localStorage.setItem(KEY,JSON.stringify(arr)); return true; }
  catch(e){ console.warn('cache save failed',e); return false; }
}

// --- mapping between the rich front-end article and a Supabase row ---
function authorSlugFor(byline){ const j=findJournalistByName(byline); return j?j.slug:null; }
function regionSlugFor(a){ for(const slug of REGION_KEYS){ if(articleMatchesRegion(a,slug)) return slug; } return null; }
function articleToRow(a){
  const media=a.media||null;
  return {
    slug:a.slug,
    headline:a.headline||'',
    dek:a.standfirst||'',
    body:Array.isArray(a.body)?a.body.join('\n\n'):(a.body||''),
    vertical:a.vertical||null,
    region:regionSlugFor(a),
    author_slug:authorSlugFor(a.byline),
    hero_image:(media&&media.type==='image')?media.src:null,
    video_url:(media&&media.type==='video')?media.src:null,
    status:a.status||'draft',
    source:a.source||'authored',
    source_url:a.sourceUrl||null,
    published_at:a.publishedAt||new Date().toISOString(),
    payload:a // full object → lossless round-trip (see migration)
  };
}
function rowToArticle(r){
  // Prefer the lossless payload; fall back to typed columns for rows written
  // outside the app (e.g. straight SQL inserts).
  if(r.payload && typeof r.payload==='object'){
    const a=Object.assign({}, r.payload);
    a.slug=r.slug; a.status=r.status; a.publishedAt=r.published_at||a.publishedAt;
    if(r.source) a.source=r.source;
    return a;
  }
  const vert=r.vertical||'front'; const def=VDEF[vert]||VDEF.front;
  return {
    slug:r.slug, vertical:vert, kicker:'', headline:r.headline||'',
    standfirst:r.dek||'', byline:r.author_slug||'AfriPulse Bureau', dateline:'',
    readingMin:4, emoji:def.emoji, color:def.color,
    status:r.status||'draft', publishedAt:r.published_at||new Date().toISOString(),
    tags:[], body:r.body?String(r.body).split('\n\n'):[],
    media:r.hero_image?{type:'image',src:r.hero_image}:(r.video_url?{type:'video',src:r.video_url}:null),
    source:r.source||'authored', sourceUrl:r.source_url||null
  };
}

// --- async store: reads/writes Supabase ---
async function loadStore(){
  const sb=await ensureSupabase();
  if(!sb) return null;
  try{
    const {data,error}=await sb.from('articles').select('*').order('published_at',{ascending:false}).limit(500);
    if(error){ console.warn('loadStore',error.message); return null; }
    return normalize((data||[]).map(rowToArticle));
  }catch(e){ console.warn('loadStore',e); return null; }
}
async function dbUpsert(list){
  const sb=await ensureSupabase();
  if(!sb) return false;
  const rows=(Array.isArray(list)?list:[list]).map(articleToRow);
  try{
    const {error}=await sb.from('articles').upsert(rows,{onConflict:'slug'});
    if(error){ console.warn('dbUpsert',error.message); return false; }
    return true;
  }catch(e){ console.warn('dbUpsert',e); return false; }
}
async function dbDelete(slug){
  const sb=await ensureSupabase();
  if(!sb) return false;
  try{
    const {error}=await sb.from('articles').delete().eq('slug',slug);
    if(error){ console.warn('dbDelete',error.message); return false; }
    return true;
  }catch(e){ console.warn('dbDelete',e); return false; }
}
async function saveStore(arr){
  saveCache(arr);          // write-through cache (instant)
  return dbUpsert(arr);    // push to Supabase (needs an authenticated session)
}
async function ensureStore(){
  const remote=await loadStore();
  if(remote && remote.length){ saveCache(remote); return remote; }
  if(remote && remote.length===0){
    const seed=seedClone();
    await dbUpsert(seed);   // best-effort first-run seed (needs auth)
    saveCache(seed);
    return seed;
  }
  // Database unreachable → fall back to the cache, then the bundled seed.
  return normalize(loadCache()||seedClone());
}

// Instant first paint from the cache; boot() refreshes from the database.
let ARTICLES=normalize(loadCache()||seedClone());

// ── HELPERS ───────────────────────────────────────────────────
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function slugify(s){
  return (s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,72) || 'story-'+Date.now();
}
function timeAgo(iso){
  const ms=Date.now()-new Date(iso).getTime();
  const m=Math.floor(ms/60000);
  if(m<1) return CURRENT_LANG==='ar'?'الآن':CURRENT_LANG==='fr'?"à l'instant":'just now';
  if(m<60) return m+(CURRENT_LANG==='ar'?' د':CURRENT_LANG==='fr'?' min':'m ago');
  const h=Math.floor(m/60);
  if(h<24) return h+(CURRENT_LANG==='ar'?' س':CURRENT_LANG==='fr'?' h':'h ago');
  return Math.floor(h/24)+(CURRENT_LANG==='ar'?' ي':CURRENT_LANG==='fr'?' j':'d ago');
}
function getArticle(slug){ return ARTICLES.find(a=>a.slug===slug); }

// ── ARTICLE MEDIA HELPERS ─────────────────────────────────────
// Default to deterministic Picsum photo seeded by slug — no auth needed.
function defaultImageFor(article){
  return 'https://picsum.photos/seed/'+encodeURIComponent(article.slug||'afripulse')+'/1200/600';
}
// Detect YouTube URL forms and convert to /embed/ form
function normalizeYouTube(url){
  if(!url) return null;
  // already embed
  const embed = url.match(/youtube\.com\/embed\/([^?&]+)/);
  if(embed) return 'https://www.youtube.com/embed/'+embed[1];
  const watch = url.match(/youtube\.com\/watch\?v=([^&]+)/);
  if(watch) return 'https://www.youtube.com/embed/'+watch[1];
  const shortUrl = url.match(/youtu\.be\/([^?&]+)/);
  if(shortUrl) return 'https://www.youtube.com/embed/'+shortUrl[1];
  return null;
}
function renderArticleMedia(a){
  const m = a.media || {};
  // VIDEO
  if(m.type==='video' && m.src){
    const ytEmbed = normalizeYouTube(m.src);
    const videoHTML = ytEmbed
      ? '<div class="video-wrap"><iframe src="'+esc(ytEmbed)+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe></div>'
      : '<div class="video-wrap"><video src="'+esc(m.src)+'" controls style="width:100%;height:100%;object-fit:cover;background:#000"></video></div>';
    return ''+
      '<figure class="art-media">'+
        videoHTML+
        ((m.caption||m.credit) ? '<figcaption class="art-media-caption"><span>'+esc(m.caption||'')+'</span>'+(m.credit?'<span class="credit">'+esc(m.credit)+'</span>':'')+'</figcaption>' : '')+
      '</figure>';
  }
  // IMAGE — explicit URL OR default placeholder
  const src = (m.type==='image' && m.src) ? m.src : defaultImageFor(a);
  const captionDefault = a.kicker || '';
  const creditDefault = (m.type==='image' && m.src) ? '' : 'Placeholder · picsum.photos';
  const caption = m.caption || captionDefault;
  const credit = m.credit || creditDefault;
  return ''+
    '<figure class="art-media">'+
      '<img src="'+esc(src)+'" alt="'+esc(a.headline)+'" loading="lazy" onerror="this.style.display=&quot;none&quot;;this.parentElement.querySelector(&quot;.placeholder&quot;).style.display=&quot;flex&quot;">'+
      '<div class="placeholder" data-emoji="'+esc(a.emoji||'📰')+'" style="display:none;background:'+esc(a.color||'#2a2a0a')+'"></div>'+
      ((caption||credit) ? '<figcaption class="art-media-caption"><span>'+esc(caption)+'</span>'+(credit?'<span class="credit">'+esc(credit)+'</span>':'')+'</figcaption>' : '')+
    '</figure>';
}
function published(){ return ARTICLES.filter(a=>a.status==='published').sort((a,b)=>new Date(b.publishedAt)-new Date(a.publishedAt)); }
function byVertical(v){ return published().filter(a=>a.vertical===v); }

let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  if(!t) return;
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),3000);
}

// ── TICKER + COMMODITIES (under verticals on reader views) ────
function renderTicker(){
  const items = published().slice(0,12);
  if(!items.length) return '';

  // Build ticker items (doubled for seamless scroll)
  let tickerInner='';
  const buildTickerItems = ()=>{
    let h='';
    for(const a of items){
      const title = a.headline.length>72 ? a.headline.slice(0,72)+'…' : a.headline;
      h += '<a class="ti" href="#/article/'+esc(a.slug)+'">'+
        '<span class="ti-region">🌍 '+esc(vshort(a.vertical))+'</span>'+
        '<span class="ti-title">'+esc(title)+'</span>'+
        '<span class="ti-src">'+esc(a.byline)+'</span>'+
      '</a>';
    }
    return h;
  };
  tickerInner = buildTickerItems() + buildTickerItems();

  // Build commodities (doubled)
  let comInner='';
  const buildCom = ()=>{
    let h='';
    for(const c of COMMODITIES){
      h += '<div class="com-item">'+
        '<span class="com-name">'+esc(c.n)+'</span>'+
        '<span>'+esc(c.v)+'</span>'+
        '<span class="com-chg '+c.d+'">'+esc(c.c)+'</span>'+
      '</div>';
    }
    return h;
  };
  comInner = buildCom() + buildCom();

  return ''+
  '<section class="ticker" aria-label="Live news ticker">'+
    '<div class="ticker-badge"><span class="d"></span>'+esc(t('live'))+'</div>'+
    '<div class="ticker-wrap"><div class="ticker-track">'+tickerInner+'</div></div>'+
  '</section>'+
  '<aside class="com-bar" aria-label="Commodities">'+
    '<div class="com-label">⛏ '+esc(t('commodities'))+'</div>'+
    '<div class="com-wrap"><div class="com-track">'+comInner+'</div></div>'+
  '</aside>';
}

// ── VIEW: HOME ────────────────────────────────────────────────
function viewHome(){
  const pub=published();
  const hero=pub[0];
  const subs=pub.slice(1,5);
  const feed=pub.slice(5,15);

  let html=renderHeader(null)+renderTicker();

  if(!hero){
    html+='<div class="empty" style="padding:80px 20px">No published stories yet. <a href="#/admin/new" style="color:var(--accent);text-decoration:underline">'+esc(t('new_article'))+'</a></div>';
    html+=renderFooter();
    return html;
  }

  let subsHTML='';
  for(const a of subs){
    subsHTML += '<a class="sub" href="#/article/'+esc(a.slug)+'">'+
      '<div class="sub-cat">'+esc(vlabel(a.vertical))+'</div>'+
      '<div class="sub-title">'+esc(a.headline)+'</div>'+
      '<div class="sub-meta">'+esc(a.dateline)+' · '+esc(timeAgo(a.publishedAt))+'</div>'+
    '</a>';
  }
  if(!subsHTML) subsHTML='<div class="sub"><div class="sub-cat">·</div><div class="sub-meta">·</div></div>';

  html += '<section class="hero">'+
    '<div class="hero-grid">'+
      '<a class="hero-main" href="#/article/'+esc(hero.slug)+'">'+
        '<div class="hero-img" data-emoji="'+esc(hero.emoji||'🌍')+'" style="background:'+esc(hero.color||'#0e2818')+'">'+
          '<span class="hero-cat">'+esc(vlabel(hero.vertical))+'</span>'+
        '</div>'+
        '<div class="hero-body">'+
          '<div class="hero-kicker">'+esc(hero.kicker)+'</div>'+
          '<h2 class="hero-title">'+esc(hero.headline)+'</h2>'+
          '<p class="hero-ex">'+esc(hero.standfirst)+'</p>'+
          '<div class="hero-meta">'+
            '<span style="color:var(--accent)">📍 '+esc(hero.dateline)+'</span>'+
            '<span class="by">'+esc(t('by'))+' '+esc(hero.byline)+'</span>'+
            '<span>'+esc(timeAgo(hero.publishedAt))+'</span>'+
            '<span>'+esc(hero.readingMin||4)+' '+esc(t('min_read'))+'</span>'+
          '</div>'+
        '</div>'+
      '</a>'+
      '<div class="hero-subs">'+subsHTML+'</div>'+
    '</div>'+
  '</section>'+
  renderAdSlotBanner();

  let feedHTML='';
  for(const a of feed){
    feedHTML += '<a class="card" href="#/article/'+esc(a.slug)+'">'+
      '<div class="card-thumb" style="background:'+esc(a.color||'#2a2a0a')+'">'+esc(a.emoji||'📰')+'</div>'+
      '<div>'+
        '<div class="card-cat">'+esc(vlabel(a.vertical))+' <span class="r">'+esc(a.readingMin||4)+' '+esc(t('min_read'))+'</span></div>'+
        '<div class="card-title">'+esc(a.headline)+'</div>'+
        '<div class="card-meta">'+esc(a.dateline)+' · '+esc(timeAgo(a.publishedAt))+' · '+esc(a.byline)+'</div>'+
        '<div class="card-url">→ /article/'+esc(a.slug)+'</div>'+
      '</div>'+
    '</a>';
  }
  if(!feedHTML) feedHTML='<div class="empty">·</div>';

  let marketsHTML='';
  for(const m of MARKETS){
    marketsHTML += '<div class="mrow"><span class="n">'+esc(m.n)+'</span><span class="v">'+esc(m.v)+'</span><span class="'+m.d+'">'+esc(m.c)+'</span></div>';
  }

  let commHTML='';
  for(const c of COMMODITY_PANEL){
    commHTML += '<div class="mrow"><span class="n">'+esc(c.n)+'</span><span class="v">'+esc(c.v)+'</span><span class="'+c.d+'">'+esc(c.c)+'</span></div>';
  }

  // Build LEFT RAIL — by-vertical archive aggregator
  let leftRailHTML = '<div class="lr-head">'+
    '<span>'+esc(t('browse_by_vertical'))+'</span>'+
    '<span class="lr-total">'+pub.length+' '+esc(t('archive_total'))+'</span>'+
  '</div>'+
  '<button class="lr-toggle-all" type="button" id="lr-toggle-all" data-state="expanded" style="margin-bottom:10px;width:100%">'+esc(t('collapse_all'))+'</button>';

  for(const vk of VERTICAL_KEYS){
    const stories = byVertical(vk);
    if(stories.length === 0) continue;
    leftRailHTML += '<div class="lr-vert">'+
      '<a class="lr-vert-head" href="#/v/'+esc(vk)+'" data-lr-vert="'+esc(vk)+'">'+
        '<span><span class="arrow open" aria-hidden="true">▸</span> '+esc(vlabel(vk))+'</span>'+
        '<span class="lr-vert-count">'+stories.length+'</span>'+
      '</a>'+
      '<div class="lr-list open" data-lr-list="'+esc(vk)+'">';
    for(const a of stories.slice(0,3)){
      const isLive = a.source === 'rss';
      leftRailHTML += '<a class="lr-art" href="#/article/'+esc(a.slug)+'">'+
        '<div class="lr-art-title">'+esc(a.headline)+'</div>'+
        '<div class="lr-art-meta">'+
          '<span>'+esc(a.dateline)+' · '+esc(timeAgo(a.publishedAt))+'</span>'+
          (isLive ? '<span class="live-badge">WIRE</span>' : '')+
        '</div>'+
      '</a>';
    }
    if(stories.length > 3){
      leftRailHTML += '<a class="lr-viewall" href="#/v/'+esc(vk)+'">'+esc(t('view_all'))+' ('+stories.length+') →</a>';
    }
    leftRailHTML += '</div></div>';
  }

  if(pub.length === 0){
    leftRailHTML += '<div class="lr-empty">'+esc(t('no_articles'))+'</div>';
  }

  // ── REGION ROWS (right panel) ────────────────────────────────
  let regionsHTML='';
  for(const rk of REGION_KEYS){
    const count = byRegion(rk).length;
    regionsHTML += '<div class="mrow region-row" data-link="#/region/'+esc(rk)+'" style="cursor:pointer">'+
      '<span class="n"><span class="flag" aria-hidden="true">'+esc(REGIONS[rk].flag)+'</span> '+esc(rlabel(rk))+'</span>'+
      '<span class="v">'+count+'</span>'+
    '</div>';
  }

  html += '<div class="main">'+
    '<aside class="left-rail" aria-label="Archive by vertical">'+leftRailHTML+'</aside>'+
    '<section class="feed">'+
      '<div class="feed-head"><span>'+esc(t('latest_stories'))+'</span><a href="#/admin" style="color:var(--accent)">'+esc(t('manage'))+'</a></div>'+
      feedHTML+
    '</section>'+
    '<aside class="rpanel">'+
      '<div class="panel-head">'+esc(t('live_markets'))+'</div>'+marketsHTML+
      '<div class="panel-head">'+esc(t('commodities'))+'</div>'+commHTML+
      '<div style="margin:14px 0">'+renderAdSlotMini()+'</div>'+
      '<div class="panel-head">'+esc(t('browse_by_region'))+'</div>'+regionsHTML+
      '<div class="panel-head">'+esc(t('newsroom'))+'</div>'+
      '<div class="mrow" style="cursor:pointer" data-link="#/admin"><span class="n">'+esc(t('cms'))+'</span><span class="v">'+ARTICLES.length+' docs</span></div>'+
      '<div class="mrow" style="cursor:pointer" data-link="#/newsletter"><span class="n">'+esc(t('daily_briefing'))+'</span><span class="v">'+esc(t('preview'))+'</span></div>'+
    '</aside>'+
  '</div>';

  html += renderInvestorCTA() + renderFooter();
  return html;
}

function viewVertical(v){
  if(VERTICAL_KEYS.indexOf(v)===-1) return view404();
  const stories=byVertical(v);
  let cardsHTML='';
  for(const a of stories){
    cardsHTML += '<a class="vert-card" href="#/article/'+esc(a.slug)+'">'+
      '<div class="vc-thumb" data-emoji="'+esc(a.emoji||'📰')+'" style="background:'+esc(a.color||'#2a2a0a')+'">'+
        '<span class="vc-cat">'+esc(vlabel(v))+'</span>'+
      '</div>'+
      '<div class="vc-body">'+
        '<div class="vc-title">'+esc(a.headline)+'</div>'+
        '<div class="vc-meta">'+esc(a.dateline)+' · '+esc(timeAgo(a.publishedAt))+' · '+esc(a.byline)+'</div>'+
      '</div>'+
    '</a>';
  }
  if(!cardsHTML) cardsHTML='<div class="empty">·</div>';

  return renderHeader(v)+renderTicker()+
    '<section class="vert-head"><h2 class="vert-h">'+esc(vlabel(v))+'</h2><div class="vert-sub">'+stories.length+' · /v/'+esc(v)+'</div></section>'+
    '<div class="vert-grid">'+cardsHTML+'</div>'+
    renderFooter();
}

// ── VIEW: REGION ARCHIVE ──────────────────────────────────────
function viewRegion(slug){
  const r=REGIONS[slug];
  if(!r) return view404();
  const stories=byRegion(slug);

// ── ROUTER ────────────────────────────────────────────────────
function route(){
  try{
    const hash=(location.hash||'#/').replace(/^#/,'');
    const parts=hash.split('/').filter(Boolean);
    const app=document.getElementById('app');
    if(!app){ console.error('No #app element'); return; }

    let html;
    if(parts.length===0) html=viewHome();
    else if(parts[0]==='article' && parts[1]) html=viewArticle(decodeURIComponent(parts[1]));
    else if(parts[0]==='v' && parts[1]) html=viewVertical(decodeURIComponent(parts[1]));
    else if(parts[0]==='region' && parts[1]) html=viewRegion(decodeURIComponent(parts[1]));
    else if(parts[0]==='journalists') html=viewJournalists();
    else if(parts[0]==='journalist' && parts[1]) html=viewJournalist(decodeURIComponent(parts[1]));
    else if(parts[0]==='admin' && parts[1]==='new') html=viewNewArticle();
    else if(parts[0]==='admin' && parts[1]==='edit' && parts[2]) html=viewAdmin(decodeURIComponent(parts[2]));
    else if(parts[0]==='admin') html=viewAdmin(null);
    else if(parts[0]==='newsletter') html=viewNewsletter();
    else html=view404();

    app.innerHTML=html;
    try{ window.scrollTo(0,0); }catch(e){}
    updateDevbarPath();
    bindView();
  }catch(err){
    console.error('Route error:',err);
    const app=document.getElementById('app');
    if(app) app.innerHTML='<div style="padding:60px 22px;text-align:center"><h2 style="font-family:\'Fraunces\',serif;color:var(--accent);font-size:32px;margin-bottom:10px">Something broke.</h2><p style="color:var(--muted);font-size:14px">Check the browser console, then click <a href="#/" style="color:var(--accent)">Home</a> to retry.</p><p style="font-size:11px;color:var(--muted);margin-top:18px;font-family:monospace">'+esc(String(err.message||err))+'</p></div>';
  }
}

function updateDevbarPath(){
  const info=document.getElementById('dev-info');
  if(info){
    const wires=ARTICLES.filter(a=>a.source==='rss').length;
    info.textContent = (wires>0 ? wires+' wires · ' : '')+'lang: '+CURRENT_LANG;
  }
  document.querySelectorAll('.devbar a[data-r]').forEach(a=>a.classList.remove('active'));
  const h=location.hash||'#/';
  let activeKey='home';
  if(h.startsWith('#/article/')||h==='#/'||h==='#'||h==='') activeKey='home';
  else if(h.startsWith('#/v/')) activeKey='vert';
  else if(h.startsWith('#/region/')) activeKey='home';
  else if(h.startsWith('#/journalists')||h.startsWith('#/journalist/')) activeKey='home';
  else if(h.startsWith('#/admin')) activeKey='admin';
  else if(h.startsWith('#/newsletter')) activeKey='nl';
  const el=document.querySelector('.devbar a[data-r="'+activeKey+'"]');
  if(el) el.classList.add('active');
}

function bindView(){
  // data-link → set hash
  document.querySelectorAll('[data-link]').forEach(el=>{
    el.addEventListener('click',function(e){
      e.preventDefault();
      const href=el.getAttribute('data-link');
      if(href) location.hash=href;
    });
  });

  // Logo home
  document.querySelectorAll('[data-r="home"]').forEach(el=>{
    if(el.classList && el.classList.contains('logo')){
      el.addEventListener('click',function(){ location.hash='#/'; });
    }
  });

  // Language switcher — works on every view
  document.querySelectorAll('.lang-link[data-lang]').forEach(el=>{
    el.addEventListener('click',function(e){
      e.preventDefault();
      setLang(el.getAttribute('data-lang'));
    });
  });

  // Left rail · per-vertical collapse (click the arrow area; the full anchor still navigates)
  // We let users tap the small arrow chevron to expand/collapse without navigating away.
  document.querySelectorAll('.lr-vert-head .arrow').forEach(arrow=>{
    arrow.addEventListener('click',function(e){
      e.preventDefault();
      e.stopPropagation();
      const head=arrow.closest('.lr-vert-head');
      const vk=head && head.getAttribute('data-lr-vert');
      if(!vk) return;
      const list=document.querySelector('[data-lr-list="'+vk+'"]');
      if(list){
        list.classList.toggle('open');
        arrow.classList.toggle('open');
      }
    });
  });

  // Left rail · expand/collapse all
  const toggleAll=document.getElementById('lr-toggle-all');
  if(toggleAll){
    toggleAll.addEventListener('click',function(){
      const isExpanded=toggleAll.getAttribute('data-state')==='expanded';
      document.querySelectorAll('.lr-list').forEach(l=>l.classList.toggle('open',!isExpanded));
      document.querySelectorAll('.lr-vert-head .arrow').forEach(a=>a.classList.toggle('open',!isExpanded));
      toggleAll.setAttribute('data-state',isExpanded?'collapsed':'expanded');
      // Update label dynamically based on current language
      const collapseLbl = CURRENT_LANG==='fr'?'Tout replier':CURRENT_LANG==='ar'?'طيّ الكل':'Collapse all';
      const expandLbl = CURRENT_LANG==='fr'?'Tout déplier':CURRENT_LANG==='ar'?'فتح الكل':'Expand all';
      toggleAll.textContent = isExpanded ? expandLbl : collapseLbl;
    });
  }

  // Subscribe (toast only)
  const sub=document.getElementById('subscribe-link');
  if(sub) sub.addEventListener('click',function(e){
    e.preventDefault();
    toast(CURRENT_LANG==='fr'?'Inscrit à la newsletter quotidienne.':CURRENT_LANG==='ar'?'تم الاشتراك في النشرة اليومية.':'Subscribed to the Daily Briefing.');
  });

  // Search
  const search=document.getElementById('site-search');
  if(search){
    search.addEventListener('keydown',function(e){
      if(e.key!=='Enter') return;
      e.preventDefault();
      const q=this.value.trim().toLowerCase();
      if(!q) return;
      const hits=published().filter(a=>(a.headline+' '+a.standfirst+' '+(a.tags||[]).join(' ')).toLowerCase().indexOf(q)>-1);
      if(hits.length){ location.hash='#/article/'+hits[0].slug; toast(hits.length+' result'+(hits.length>1?'s':'')+' for "'+q+'"'); }
      else toast('No stories match "'+q+'".');
    });
  }

  // Admin filter
  const filt=document.getElementById('adm-filter');
  if(filt){
    filt.addEventListener('input',function(){
      const q=this.value.trim().toLowerCase();
      document.querySelectorAll('#adm-doc-list .adm-doc').forEach(d=>{
        const t=d.querySelector('.adm-doc-title').textContent.toLowerCase();
        d.style.display=(!q || t.indexOf(q)>-1)?'':'none';
      });
    });
  }

  // Admin editor
  const headInput=document.querySelector('input[name="headline"]');
  if(headInput){
    headInput.addEventListener('input',function(){
      const c=document.getElementById('head-count');
      if(c) c.textContent=this.value.length;
      const form=document.getElementById('article-form');
      const origSlug=form && form.getAttribute('data-original-slug');
      if(!origSlug){
        const sp=document.getElementById('slug-preview');
        if(sp) sp.textContent='/article/'+(slugify(this.value)||'untitled');
      }
    });
  }

  const tagInput=document.getElementById('tag-input');
  if(tagInput){
    tagInput.addEventListener('keydown',function(e){
      if(e.key!=='Enter' && e.key!==',') return;
      e.preventDefault();
      const val=this.value.trim();
      if(!val) return;
      const container=document.getElementById('tags-container');
      const existing=Array.from(container.querySelectorAll('.adm-tag')).map(tt=>tt.getAttribute('data-tag'));
      if(existing.indexOf(val)===-1){
        const span=document.createElement('span');
        span.className='adm-tag';
        span.setAttribute('data-tag',val);
        span.style.cssText='background:#222528;color:#9AA0A6;padding:4px 10px;border-radius:999px;font-size:11px;display:inline-flex;align-items:center;gap:6px;margin:2px';
        span.innerHTML=esc(val)+'<span class="x" data-remove-tag="'+esc(val)+'" style="cursor:pointer;color:#5F6469">×</span>';
        container.insertBefore(span,this);
      }
      this.value='';
    });
    const tagsContainer=document.getElementById('tags-container');
    if(tagsContainer){
      tagsContainer.addEventListener('click',function(e){
        const x=e.target.closest('[data-remove-tag]');
        if(x && x.parentElement) x.parentElement.remove();
      });
    }
  }

  const saveBtn=document.getElementById('save-btn');
  if(saveBtn) saveBtn.addEventListener('click',saveArticle);
  const delBtn=document.getElementById('delete-btn');
  if(delBtn) delBtn.addEventListener('click',deleteArticle);
}

function saveArticle(){
  const form=document.getElementById('article-form');
  if(!form){ toast('Editor not found.'); return; }
  const data={};
  form.querySelectorAll('[name]').forEach(el=>{ data[el.name]=el.value.trim(); });
  if(!data.headline){ toast('Headline required.'); return; }

  const originalSlug=form.getAttribute('data-original-slug') || '';
  const existing=originalSlug?getArticle(originalSlug):null;
  const tags=Array.from(form.querySelectorAll('#tags-container .adm-tag')).map(tt=>tt.getAttribute('data-tag'));
  const body=(data.body||'').split(/\n{2,}/).map(p=>p.trim()).filter(Boolean);

  let newSlug;
  if(existing){
    newSlug=existing.slug;
  }else{
    newSlug=slugify(data.headline);
    let n=1; const base=newSlug;
    while(ARTICLES.some(a=>a.slug===newSlug)){ newSlug=base+'-'+(++n); }
  }

  // Media: only set if a type was chosen
  let mediaObj = null;
  if(data.mediaType){
    mediaObj = {
      type: data.mediaType,
      src: data.mediaSrc || '',
      caption: data.mediaCaption || '',
      credit: data.mediaCredit || ''
    };
  }

  const updated={
    slug:newSlug,
    vertical:data.vertical||'front',
    kicker:data.kicker||'',
    headline:data.headline,
    standfirst:data.standfirst||'',
    byline:data.byline||'AfriPulse Bureau',
    dateline:data.dateline||'Lagos',
    readingMin:parseInt(data.readingMin,10)||4,
    emoji:data.emoji||'📰',
    color:data.color||'#2a2a0a',
    status:data.status||'draft',
    publishedAt:existing?existing.publishedAt:new Date().toISOString(),
    tags:tags,
    body:body.length?body:(existing?existing.body:['Start writing here.']),
    media: mediaObj,
    source:'authored'
  };

  if(existing){
    const i=ARTICLES.findIndex(a=>a.slug===originalSlug);
    ARTICLES[i]=updated;
  }else{
    ARTICLES.unshift(updated);
  }
  saveCache(ARTICLES);                 // instant local persistence
  toast(existing?'Saved.':'Created.');
  location.hash='#/admin/edit/'+updated.slug;
  setTimeout(route,30);
  // Persist this article (save / publish) to Supabase.
  dbUpsert(updated).then(function(ok){ if(!ok) toast('Saved locally · sign in to sync to the database.'); });
}

function deleteArticle(){
  const form=document.getElementById('article-form');
  if(!form) return;
  const slug=form.getAttribute('data-original-slug');
  if(!slug) return;
  if(!confirm('Delete this article?')) return;
  ARTICLES=ARTICLES.filter(a=>a.slug!==slug);
  saveCache(ARTICLES);                 // instant local removal
  toast('Deleted.');
  location.hash='#/admin';
  setTimeout(route,30);
  // Remove from Supabase.
  dbDelete(slug).then(function(ok){ if(!ok) toast('Removed locally · sign in to sync the deletion.'); });
}
